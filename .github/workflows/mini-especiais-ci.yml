name: mini-especiais-ci

on:
  pull_request:
    paths:
      - "src/lib/catalog/pizzas.ts"
      - "src/lib/catalog/miniEspeciais.test.ts"
      - "src/lib/catalog/officialMenu2026.ts"
      - "src/lib/catalog/officialMenu2026.test.ts"
      - "src/lib/pricing/pizzaEngine.ts"
      - "src/lib/pricing/pizzaEngine.test.ts"
      - "src/app/cardapio/page.tsx"
      - "src/app/cardapio/page.test.ts"
      - ".github/workflows/mini-especiais-ci.yml"

permissions:
  contents: write

concurrency:
  group: mini-especiais-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corrigir-e-validar:
    if: github.event.pull_request.head.ref == 'fix/pizza-meio-categoria-real-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Provar regressão antes do patch
        shell: bash
        run: |
          cat > src/lib/pricing/pizzaCategoriaAtual.regression.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { buildPizzaCatalog } from "@/lib/catalog/pizzas";
          import { MENU } from "@/lib/menu";
          import { precificarPizzaPorId } from "./pizzaEngine";
          const catalog = buildPizzaCatalog(MENU);
          describe("regressão: meio a meio entre categorias", () => {
            it("Tradicional + Especial cobra metade real de cada sabor", () => {
              const size = catalog.sizes.find((s) => s.code === "G")!;
              const tradicional = catalog.flavors.find((f) => f.category === "tradicional" && f.pricesBySizeCode.G !== undefined)!;
              const especial = catalog.flavors.find((f) => f.category === "especial" && f.pricesBySizeCode.G !== undefined)!;
              const esperado = Math.round((tradicional.pricesBySizeCode.G! + especial.pricesBySizeCode.G!) / 2);
              const r = precificarPizzaPorId({ sizeId: size.id, flavorIds: [tradicional.id, especial.id], quantity: 1 }, catalog);
              expect(r.ok).toBe(true);
              if (r.ok) expect(r.unitPriceCents).toBe(esperado);
            });
          });
          EOF
          set +e
          npx vitest run src/lib/pricing/pizzaCategoriaAtual.regression.test.ts
          status=$?
          set -e
          rm src/lib/pricing/pizzaCategoriaAtual.regression.test.ts
          if [ "$status" -eq 0 ]; then
            echo "A regressão não foi reproduzida; abortando por segurança."
            exit 1
          fi
          echo "Regressão reproduzida: a regra atual promove a metade mais barata ao preço da mais cara."

      - name: Aplicar patch mínimo
        shell: python
        run: |
          from pathlib import Path

          def trocar_unico(texto, antigo, novo, nome):
              qtd = texto.count(antigo)
              if qtd != 1:
                  raise SystemExit(f"{nome}: alvo encontrado {qtd} vez(es)")
              return texto.replace(antigo, novo, 1)

          engine = Path("src/lib/pricing/pizzaEngine.ts")
          e = engine.read_text(encoding="utf-8")
          e = trocar_unico(
              e,
              "// - Meio a meio cobra o MAIOR preço entre os sabores escolhidos, no tamanho\n//   escolhido — a ordem dos sabores nunca altera o preço (Math.max,\n//   comutativo por construção).",
              "// - Meio a meio entre CATEGORIAS DIFERENTES cobra metade do preço real de\n//   cada sabor no tamanho escolhido (ex.: Tradicional + Especial).\n// - Meio a meio dentro da MESMA categoria preserva a regra existente de\n//   cobrar o maior preço entre os dois sabores. A ordem nunca altera o total.",
              "regra do motor",
          )
          e = e.replace(
              "// - Borda e adicionais são somados DEPOIS do preço-base (maior sabor);",
              "// - Borda e adicionais são somados DEPOIS do preço-base dos sabores;",
              1,
          )
          e = e.replace(
              "  // Meio a meio = maior preço entre os sabores no tamanho escolhido —\n  // Math.max sobre o preço de cada sabor (nunca média, nunca metade de\n  // cada, nunca depende da ordem em que os sabores foram enviados).",
              "  // Categorias diferentes: 50% do preço real de cada sabor. Mesma categoria:\n  // mantém a regra existente do maior preço. O cálculo segue em centavos\n  // e continua vindo somente do catálogo oficial, nunca do navegador.",
              1,
          )
          e = trocar_unico(
              e,
              "  const unitPriceCents = Math.max(...precosPorSabor) + borderCents + addOnCents;",
              "  const categoriasDiferentes = flavors.length === 2 && flavors[0].category !== flavors[1].category;\n  const precoSaboresCents = categoriasDiferentes\n    ? Math.round((precosPorSabor[0] + precosPorSabor[1]) / 2)\n    : Math.max(...precosPorSabor);\n  const unitPriceCents = precoSaboresCents + borderCents + addOnCents;",
              "cálculo server-side",
          )
          engine.write_text(e, encoding="utf-8")

          page = Path("src/app/cardapio/page.tsx")
          p = page.read_text(encoding="utf-8")
          p = p.replace(
              "// meio a meio cobra o MAIOR preço entre os sabores, nunca a média; borda e",
              "// meio a meio entre categorias diferentes cobra 50% de cada sabor; na mesma categoria mantém o maior preço; borda e",
              1,
          )
          p = trocar_unico(
              p,
              "    base = Math.max(preco1, preco2);",
              "    base = flavor1Entry?.category !== flavor2Entry?.category\n      ? Math.round((preco1 + preco2) / 2)\n      : Math.max(preco1, preco2);",
              "cálculo local",
          )
          page.write_text(p, encoding="utf-8")

          tests = Path("src/lib/pricing/pizzaEngine.test.ts")
          t = tests.read_text(encoding="utf-8")
          inicio = t.find('describe("motor nativo: meio a meio cobra o MAIOR preço entre os sabores')
          fim = t.find('describe("motor nativo: borda e adicionais somam depois do preço-base', inicio + 1)
          if inicio < 0 or fim < 0:
              raise SystemExit("bloco de testes antigo do motor não encontrado")
          bloco = '''describe("motor nativo: meio a meio preserva preço real entre categorias", () => {
            it("mesma categoria continua cobrando o MAIOR preço e não depende da ordem", () => {
              const barato = flavorIdByName("Presunto");
              const caro = flavorIdByName("Á Moda da Casa");
              for (const code of ["F", "G", "M", "P", "MINI"]) {
                const direto = precificarPizzaPorId({ sizeId: sizeIdByCode(code), flavorIds: [barato, caro], quantity: 1 }, catalog);
                const invertido = precificarPizzaPorId({ sizeId: sizeIdByCode(code), flavorIds: [caro, barato], quantity: 1 }, catalog);
                const esperado = PIZZA_FLAVORS.find((f) => f.name === "Á Moda da Casa")!.pricesBySizeCode[code as "F"];
                expect(direto.ok).toBe(true);
                expect(invertido.ok).toBe(true);
                if (direto.ok) expect(direto.unitPriceCents).toBe(esperado);
                if (invertido.ok) expect(invertido.unitPriceCents).toBe(esperado);
              }
            });

            it("Tradicional + Especial cobra metade do preço real de cada sabor nas duas ordens", () => {
              const tradicional = PIZZA_FLAVORS.find((f) => f.category === "tradicional" && f.pricesBySizeCode.G !== undefined)!;
              const especial = PIZZA_FLAVORS.find((f) => f.category === "especial" && f.pricesBySizeCode.G !== undefined)!;
              const esperado = Math.round((tradicional.pricesBySizeCode.G! + especial.pricesBySizeCode.G!) / 2);
              const direto = precificarPizzaPorId({ sizeId: sizeIdByCode("G"), flavorIds: [flavorIdByName(tradicional.name), flavorIdByName(especial.name)], quantity: 1 }, catalog);
              const invertido = precificarPizzaPorId({ sizeId: sizeIdByCode("G"), flavorIds: [flavorIdByName(especial.name), flavorIdByName(tradicional.name)], quantity: 1 }, catalog);
              expect(direto.ok).toBe(true);
              expect(invertido.ok).toBe(true);
              if (direto.ok) expect(direto.unitPriceCents).toBe(esperado);
              if (invertido.ok) expect(invertido.unitPriceCents).toBe(esperado);
            });

            it("Tradicional + Doce também cobra metade do preço real de cada categoria", () => {
              const tradicional = PIZZA_FLAVORS.find((f) => f.category === "tradicional" && f.pricesBySizeCode.G !== undefined)!;
              const doce = PIZZA_FLAVORS.find((f) => f.category === "doce" && f.pricesBySizeCode.G !== undefined)!;
              const esperado = Math.round((tradicional.pricesBySizeCode.G! + doce.pricesBySizeCode.G!) / 2);
              const r = precificarPizzaPorId({ sizeId: sizeIdByCode("G"), flavorIds: [flavorIdByName(tradicional.name), flavorIdByName(doce.name)], quantity: 1 }, catalog);
              expect(r.ok).toBe(true);
              if (r.ok) expect(r.unitPriceCents).toBe(esperado);
            });

            it("Especial + Especial continua usando Math.max", () => {
              const [a, b] = PIZZA_FLAVORS.filter((f) => f.category === "especial" && f.pricesBySizeCode.G !== undefined);
              const esperado = Math.max(a.pricesBySizeCode.G!, b.pricesBySizeCode.G!);
              const r = precificarPizzaPorId({ sizeId: sizeIdByCode("G"), flavorIds: [flavorIdByName(a.name), flavorIdByName(b.name)], quantity: 1 }, catalog);
              expect(r.ok).toBe(true);
              if (r.ok) expect(r.unitPriceCents).toBe(esperado);
            });
          });

          '''
          t = t[:inicio] + bloco + t[fim:]
          t = t.replace(
              'it("preço = maior sabor + borda + soma dos adicionais", () => {',
              'it("preço = preço-base dos sabores + borda + soma dos adicionais", () => {',
              1,
          )
          tests.write_text(t, encoding="utf-8")

          page_tests = Path("src/app/cardapio/page.test.ts")
          pt = page_tests.read_text(encoding="utf-8")
          pt = trocar_unico(
              pt,
              "    // Sanidade: o par com Especial custava o preço do Especial (mais caro).\n    expect(precoComEspecial).toBe(catalog.flavors.find((f) => f.name === especiais[0])!.pricesBySizeCode.G!);",
              "    // Mistura de categorias: 50% do preço real da Tradicional + 50% da Especial.\n    const precoTrad = catalog.flavors.find((f) => f.name === tradicionais[0])!.pricesBySizeCode.G!;\n    const precoEsp = catalog.flavors.find((f) => f.name === especiais[0])!.pricesBySizeCode.G!;\n    expect(precoComEspecial).toBe(Math.round((precoTrad + precoEsp) / 2));",
              "Caso C2",
          )
          pt = trocar_unico(
              pt,
              'test("Caso H — Tradicional + Especial cobra o MAIOR preço (regra existente), e a prévia da tela bate com o servidor", () => {',
              'test("Caso H — Tradicional + Especial cobra metade real de cada categoria, e a prévia bate com o servidor", () => {',
              "título Caso H",
          )
          pt = trocar_unico(
              pt,
              "    const esperado = Math.max(preco1, preco2);",
              "    const esperado = Math.round((preco1 + preco2) / 2);",
              "expectativa Caso H",
          )
          pt = pt.replace(
              'test("meio a meio: usa o MAIOR preço entre os 2 sabores no tamanho (nunca média, nunca depende da ordem do clique)", () => {',
              'test("meio a meio da mesma categoria: usa o MAIOR preço entre os 2 sabores e não depende da ordem", () => {',
              1,
          )
          page_tests.write_text(pt, encoding="utf-8")

      - name: Testes focados de preço, cliente e servidor
        run: >-
          npx vitest run
          src/lib/pricing/pizzaEngine.test.ts
          src/app/cardapio/page.test.ts
          src/app/api/pedido-app/route.test.ts

      - name: Lint do patch de produção
        run: npx eslint src/lib/pricing/pizzaEngine.ts src/app/cardapio/page.tsx

      - name: Typecheck comparado com a main
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/branch-tsc.txt 2>&1
          set -e
          git worktree add --detach /tmp/main-base 07b20f01f5f66d74deaa12855c3f9f508a4dd124
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/main-base/node_modules
          cd /tmp/main-base
          set +e
          npx tsc --noEmit --pretty false > /tmp/main-tsc.txt 2>&1
          set -e
          cd "$GITHUB_WORKSPACE"
          b=$(grep -c 'error TS[0-9]' /tmp/branch-tsc.txt || true)
          m=$(grep -c 'error TS[0-9]' /tmp/main-tsc.txt || true)
          echo "main erros TS=$m | branch erros TS=$b"
          test "$b" -le "$m"

      - name: Build de produção
        run: npm run build

      - name: Restaurar gate oficial e validar diff
        shell: bash
        run: |
          git diff --check
          git checkout 07b20f01f5f66d74deaa12855c3f9f508a4dd124 -- .github/workflows/mini-especiais-ci.yml
          git diff --check
          git diff --stat

      - name: Persistir somente o patch validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pricing/pizzaEngine.ts src/lib/pricing/pizzaEngine.test.ts src/app/cardapio/page.tsx src/app/cardapio/page.test.ts .github/workflows/mini-especiais-ci.yml
          git commit -m "fix(pizza): calcula metade pelo preço real de cada categoria"
          git push origin HEAD:fix/pizza-meio-categoria-real-20260822
