name: tmp-finalize-gate-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-test:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/pedidos-gate-operacional-paridade-sf-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedidos-gate-operacional-paridade-sf-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and run anchored patch
        shell: bash
        run: |
          awk '/^          python - <<'"'"'PY'"'"'$/{capt=1;next} /^          PY$/{if(capt){exit}} capt{sub(/^          /,""); print}' .github/workflows/tmp-patch-gate-operacional.yml > /tmp/gate-patch.py
          test -s /tmp/gate-patch.py
          python /tmp/gate-patch.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focused operational tests
        run: >-
          npx vitest run
          src/lib/limpezaOperacionalPedidos.test.ts
          src/lib/limpezaOperacionalPedidos.paridadeSf.test.ts
          src/app/pedidos/page.gateOperacional.test.ts
          src/app/api/orders/route.gateOperacional.test.ts
          src/app/api/orders/problema-entrega/route.safety.test.ts
          src/lib/expedienteOperacional.test.ts
          src/lib/pedidoComandaPainel.test.ts
          src/app/pedidos/page.test.ts

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/api/orders/route.ts src/app/pedidos/page.tsx src/lib/limpezaOperacionalPedidos.test.ts src/lib/limpezaOperacionalPedidos.paridadeSf.test.ts src/app/pedidos/page.gateOperacional.test.ts src/app/api/orders/route.gateOperacional.test.ts src/app/api/orders/problema-entrega/route.safety.test.ts
          git commit -m 'fix(pedidos): fecha paridade do gate operacional'
          git push origin HEAD:fix/pedidos-gate-operacional-paridade-sf-20260820
