name: economia-fix-lint-temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  corrigir:
    if: github.head_ref == 'perf/economia-final-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/economia-final-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Corrigir somente os dois apontamentos do lint permanente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/pedidos/page.tsx')
          text = path.read_text()

          mount_old = '''  useEffect(() => {\n    const user = getUserInfo()'''
          mount_new = '''  useEffect(() => {\n    const tituloOriginal = tituloOriginalRef.current\n    const user = getUserInfo()'''
          if text.count(mount_old) != 1:
              raise SystemExit('mount marker inesperado')
          text = text.replace(mount_old, mount_new, 1)

          cleanup_old = '''document.title = tituloOriginalRef.current }\n  }, [router])'''
          cleanup_new = '''document.title = tituloOriginal }\n  }, [router])'''
          if text.count(cleanup_old) != 1:
              raise SystemExit('cleanup marker inesperado')
          text = text.replace(cleanup_old, cleanup_new, 1)

          bloco = '''  const carregarHistoricoConversa = async (phone: string) => {\n    try {\n      const r = await fetch(`/api/pedido-combinado?phone=${encodeURIComponent(phone)}`)\n      if (r.ok) {\n        const data = await r.json()\n        setHistoricoMsgs(data.conversa ?? [])\n      }\n    } catch {}\n  }\n\n'''
          if text.count(bloco) != 1:
              raise SystemExit('bloco carregarHistoricoConversa inesperado')
          text = text.replace(bloco, '', 1)

          efeito = '''  useEffect(() => {\n    if (!sessaoAtiva || filtro !== "tempo_real") return\n    return iniciarPollingVisivel({ executar: () => carregarHistoricoConversa(sessaoAtiva), intervaloMs: 3000, pausarOculto: true })\n  }, [sessaoAtiva, filtro])'''
          if text.count(efeito) != 1:
              raise SystemExit('efeito de historico inesperado')
          text = text.replace(efeito, bloco + efeito, 1)

          path.write_text(text)
          PY
      - name: Testes focados dos dois pacotes
        run: >-
          npx vitest run
          src/app/api/orders/route.economia.test.ts
          src/app/pedidos/pollingEconomia.page.test.ts
          src/lib/pollingVisivel.test.ts
          scripts/ci/check-mcp-observer-cron-workflow.test.mjs
          scripts/ci/economia-crons.test.mjs
          src/lib/inatividadeConversa.test.ts
          src/lib/inatividadeSemCancelamento.regression.test.ts
          src/lib/pixGuardiaoScheduler.test.ts
          src/lib/pixPendenteLocal.test.ts
          src/app/api/orders/confirmar-pix-manual/route.test.ts
      - name: Lint das linhas alteradas contra main
        shell: bash
        run: |
          base_sha="649660b8abf49cb3076c19671d51e7096d6d54ff"
          git diff --unified=0 "$base_sha" -- src/app/pedidos/page.tsx src/app/api/orders/route.ts > /tmp/changed.patch
          set +e
          npx eslint src/app/pedidos/page.tsx src/app/api/orders/route.ts -f json > /tmp/eslint.json
          set -e
          python - <<'PY'
          import json, re
          from pathlib import Path

          changed = {}
          current = None
          for raw in Path('/tmp/changed.patch').read_text().splitlines():
              if raw.startswith('+++ b/'):
                  current = raw[6:]
                  changed.setdefault(current, set())
              elif current and raw.startswith('@@ '):
                  m = re.search(r'\+(\d+)(?:,(\d+))?', raw)
                  if m:
                      start = int(m.group(1)); count = int(m.group(2) or '1')
                      changed[current].update(range(start, start + count))

          violations = []
          for result in json.loads(Path('/tmp/eslint.json').read_text() or '[]'):
              rel = str(Path(result['filePath']).resolve().relative_to(Path.cwd().resolve()))
              for msg in result.get('messages', []):
                  if int(msg.get('line') or 0) in changed.get(rel, set()):
                      violations.append(f"{rel}:{msg.get('line')}:{msg.get('column')} {msg.get('ruleId')} — {msg.get('message')}")
          if violations:
              print('\n'.join(violations))
              raise SystemExit(1)
          print('Lint: nenhuma violacao nas linhas alteradas.')
          PY
      - name: Build de produção
        run: npm run build
      - name: Diff sanity
        run: git diff --check 649660b8abf49cb3076c19671d51e7096d6d54ff
      - name: Commitar patch validado
        shell: bash
        run: |
          git config user.name "pizzariasaofrancisco2026-afk"
          git config user.email "pizzariasaofrancisco2026@gmail.com"
          git rm .github/workflows/economia-fix-lint-temporary.yml
          git add src/app/pedidos/page.tsx
          git commit -m "fix(economia): fecha lint do pacote final"
          git push origin HEAD:perf/economia-final-20260822
