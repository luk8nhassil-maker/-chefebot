name: Salao critico 1 fail-safe temporario

on:
  push:
    branches:
      - codex/salao-status-operacional-critico-1

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/salao-status-operacional-critico-1
          fetch-depth: 0
      - name: Aplicar hardening deterministico
        run: |
          if grep -q 'marcarStatusOperacionalComoPendente' src/app/salao/page.tsx; then
            echo 'Hardening ja aplicado.'
            exit 0
          fi
          node scripts/patch-salao-critico-1-fail-safe.mjs
          git diff --check
      - name: Gravar na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/salao/page.tsx src/app/salao/page.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(salao): falha fechada quando status nao atualiza'
          git push origin HEAD:codex/salao-status-operacional-critico-1
