        run: >-
          npx eslint
          src/lib/afterResponse.ts
          src/lib/mercadoPagoCancelamento.ts
          src/lib/mercadoPagoCancelamento.test.ts
          src/lib/pixPagamentoTimeout.ts
          src/lib/pixPagamentoTimeout.test.ts
