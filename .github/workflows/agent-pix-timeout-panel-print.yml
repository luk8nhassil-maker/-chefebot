      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Typecheck against main baseline
        shell: bash
        run: |
          rm -rf .next
          set +e
          npx tsc --noEmit --pretty false > /tmp/branch-tsc.txt 2>&1
          branch_code=$?
          set -e
          git worktree add --detach /tmp/chefebot-main "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chefebot-main/node_modules
          rm -rf /tmp/chefebot-main/.next
          set +e
          (cd /tmp/chefebot-main && ./node_modules/.bin/tsc --noEmit --pretty false) > /tmp/base-tsc.txt 2>&1
          base_code=$?
          set -e
          sort /tmp/branch-tsc.txt > /tmp/branch-tsc.sorted
          sort /tmp/base-tsc.txt > /tmp/base-tsc.sorted
          if ! diff -u /tmp/base-tsc.sorted /tmp/branch-tsc.sorted; then
            echo "Typecheck divergiu da baseline da main"
            exit 1
          fi
          echo "Typecheck baseline preservada (branch=$branch_code base=$base_code)"

      - name: Diff sanity
        run: |
          git diff --check
          git status --short

      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-pix-timeout-panel-print.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add src docs
          git commit -m "feat(pix): aviso 6min cancelamento seguro 13min e aceite rápido"
          git push origin HEAD:agent/pix-timeout-panel-print-20260810
