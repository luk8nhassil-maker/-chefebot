name: Agent Pix timeout panel print patch

on:
  push:
    branches:
      - agent/pix-timeout-panel-print-20260810

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: cc2885f6d874bc949dc3f798bbb083255357a7c4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply minimal audited patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly 1 match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Marcos de 6 e 13 minutos, sem alterar a cadência normal já validada.
          replace_once(
              "src/lib/pixAutoCheckConfig.ts",
              "export const PIX_GUARDIAO_IDADE_MAXIMA_MS = 45 * 60 * 1000;\n\n// --- Sentinela Pix",
              "export const PIX_GUARDIAO_IDADE_MAXIMA_MS = 45 * 60 * 1000;\n\n// Política comercial de pagamento Pix Mercado Pago: aviso em 6 minutos e\n// cancelamento em 13 minutos. O limite operacional de 45 min do Guardião\n// continua existindo apenas como rede de segurança para falhas de infraestrutura.\nexport const PIX_PAGAMENTO_AVISO_PENDENTE_MS = 6 * 60 * 1000;\nexport const PIX_PAGAMENTO_CANCELAMENTO_MS = 13 * 60 * 1000;\nexport const PIX_PAGAMENTO_RETRY_INCONCLUSIVO_MS = 15_000;\n\nexport function calcularDelayAteProximoMarcoPagamentoPix(idadeMs: number): number | null {\n  const idade = Math.max(0, Number.isFinite(idadeMs) ? idadeMs : 0);\n  if (idade < PIX_PAGAMENTO_AVISO_PENDENTE_MS) return PIX_PAGAMENTO_AVISO_PENDENTE_MS - idade;\n  if (idade < PIX_PAGAMENTO_CANCELAMENTO_MS) return PIX_PAGAMENTO_CANCELAMENTO_MS - idade;\n  return null;\n}\n\n// --- Sentinela Pix"
          )

          # 2) Endpoint QStash: aplica a política depois da checagem oficial e
          #    nunca agenda um tick para depois do próximo marco de 6/13 min.
          replace_once(
              "src/app/api/interno/pix-guardiao/verificar/route.ts",
              'import { calcularIntervaloPorIdade } from "@/lib/pixAutoCheckConfig";',
              'import {\n  calcularDelayAteProximoMarcoPagamentoPix,\n  calcularIntervaloPorIdade,\n  PIX_PAGAMENTO_AVISO_PENDENTE_MS,\n} from "@/lib/pixAutoCheckConfig";\nimport { processarPoliticaTimeoutPagamentoPix } from "@/lib/pixPagamentoTimeout";'
          )
          replace_once(
              "src/app/api/interno/pix-guardiao/verificar/route.ts",
              dedent('''\
                // Calcula o próximo delay a partir do estado persistido pelo Sentinela
                // (proximaConsultaMercadoPagoEm) quando disponível; fallback para a
                // cadência por idade. O mínimo de 1s evita publicar delay=0 em bordas.
                const estadoAtual = await carregarEstadoSentinela(pedidoId);
                const idadeMs = estadoAtual?.criadoEm ? Math.max(0, Date.now() - estadoAtual.criadoEm) : 0;
                const proximaConsultaEm = resultado.proximaConsultaMercadoPagoEm ?? estadoAtual?.proximaConsultaMercadoPagoEm;
                const proximoDelayMs = proximaConsultaEm
                  ? Math.max(1_000, proximaConsultaEm - Date.now())
                  : calcularIntervaloPorIdade(idadeMs);

                const proximaTentativa = tentativa + 1;
                const agendado = await agendarProximaVerificacaoPixGuardiao({ pedidoId, tentativa: proximaTentativa, geracao, delayMs: proximoDelayMs });
          '''),
              dedent('''\
                // Política de expiração do pagamento roda apenas a partir do marco de
                // aviso. Ela nunca cancela por relógio sozinho: aos 13 min tenta antes
                // encerrar a cobrança pendente no próprio Mercado Pago.
                const estadoAtual = await carregarEstadoSentinela(pedidoId);
                const idadeMs = estadoAtual?.criadoEm ? Math.max(0, Date.now() - estadoAtual.criadoEm) : 0;
                const politicaTimeout = idadeMs >= PIX_PAGAMENTO_AVISO_PENDENTE_MS
                  ? await processarPoliticaTimeoutPagamentoPix({ pedidoId, agora: Date.now() })
                  : { encerrado: false, motivo: "antes_do_aviso" };

                if (politicaTimeout.encerrado) {
                  await incrementarContadorPix("sentinela_cadeia_encerrada");
                  return NextResponse.json({
                    ok: true,
                    encerrado: true,
                    motivo: politicaTimeout.motivo,
                    timeoutPagamento: true,
                  });
                }

                // Calcula o próximo delay a partir do estado persistido pelo Sentinela
                // (proximaConsultaMercadoPagoEm) quando disponível; fallback para a
                // cadência por idade. Nunca deixa o próximo tick ultrapassar os marcos
                // de 6 e 13 minutos, mesmo na faixa normal de 60s do Guardião.
                const proximaConsultaEm = resultado.proximaConsultaMercadoPagoEm ?? estadoAtual?.proximaConsultaMercadoPagoEm;
                let proximoDelayMs = proximaConsultaEm
                  ? Math.max(1_000, proximaConsultaEm - Date.now())
                  : calcularIntervaloPorIdade(idadeMs);
                const delayMarco = calcularDelayAteProximoMarcoPagamentoPix(idadeMs);
                if (delayMarco !== null) proximoDelayMs = Math.min(proximoDelayMs, Math.max(1_000, delayMarco));
                if (typeof politicaTimeout.proximoDelayMs === "number") {
                  proximoDelayMs = Math.min(proximoDelayMs, Math.max(1_000, politicaTimeout.proximoDelayMs));
                }

                const proximaTentativa = tentativa + 1;
                const agendado = await agendarProximaVerificacaoPixGuardiao({ pedidoId, tentativa: proximaTentativa, geracao, delayMs: proximoDelayMs });
          '''),
          )

          # 3) Fallback do painel: se QStash estiver indisponível, o ciclo já
          #    existente do Guardião também aplica a mesma política idempotente.
          replace_once(
              "src/app/api/admin/mercadopago/guardiao-pix/route.ts",
              'import { executarGuardiaoPix } from "@/lib/pixGuardiao";',
              'import { executarGuardiaoPix } from "@/lib/pixGuardiao";\nimport { processarTimeoutsPixPendentesEmLote } from "@/lib/pixPagamentoTimeout";'
          )
          replace_once(
              "src/app/api/admin/mercadopago/guardiao-pix/route.ts",
              '  const resultado = await executarGuardiaoPix();\n  return NextResponse.json({ ok: true, ...resultado });',
              '  const resultado = await executarGuardiaoPix();\n  const timeoutPagamento = await processarTimeoutsPixPendentesEmLote();\n  return NextResponse.json({ ok: true, ...resultado, timeoutPagamento });'
          )

          # 4) Ação "novo -> em_preparo": o status e a permissão de auto-print
          #    respondem antes da chamada externa ao WhatsApp. O envio continua
          #    garantido no pós-resposta pelo Next.js after().
          replace_once(
              "src/app/api/orders/route.ts",
              "import { NextRequest, NextResponse } from 'next/server'",
              "import { NextRequest, NextResponse } from 'next/server'\nimport { agendarTarefaAposResposta } from '@/lib/afterResponse'"
          )
          replace_once(
              "src/app/api/orders/route.ts",
              dedent('''\
                if (!silent && !(status === 'saiu_entrega' && entregadorCanonico)) {
                  const notificacao = await notificarCliente(pedidos[index].telefone, status, pedidos[index].cliente, pedidos[index].tipoEntrega, pedidos[index].endereco, statusAnterior)
                  if (notificacao && !notificacao.ok) {
                    avisosOperacionais.push('Status atualizado, mas a mensagem ao cliente não foi enviada. Tente novamente pelo WhatsApp.')
                  }
                }
          '''),
              dedent('''\
                if (!silent && !(status === 'saiu_entrega' && entregadorCanonico)) {
                  const enviarNotificacaoStatus = () => notificarCliente(
                    pedidos[index].telefone,
                    status,
                    pedidos[index].cliente,
                    pedidos[index].tipoEntrega,
                    pedidos[index].endereco,
                    statusAnterior
                  )

                  // O aceite é o caminho crítico do balcão: status já foi persistido e
                  // a permissão de impressão automática já foi decidida. Não segure a
                  // resposta ao painel esperando a Evolution/WhatsApp; execute esse
                  // efeito depois da resposta. Em ambientes sem contexto `after`
                  // (ex.: teste unitário direto), preserva o comportamento anterior.
                  if (status === 'em_preparo') {
                    const agendada = agendarTarefaAposResposta(async () => {
                      const notificacao = await enviarNotificacaoStatus()
                      if (notificacao && !notificacao.ok) {
                        console.error('[ChefeBot] Status atualizado, mas a notificação de preparo não foi enviada.', {
                          pedidoId: id,
                          motivo: notificacao.motivo,
                        })
                      }
                    })
                    if (!agendada) {
                      const notificacao = await enviarNotificacaoStatus()
                      if (notificacao && !notificacao.ok) {
                        avisosOperacionais.push('Status atualizado, mas a mensagem ao cliente não foi enviada. Tente novamente pelo WhatsApp.')
                      }
                    }
                  } else {
                    const notificacao = await enviarNotificacaoStatus()
                    if (notificacao && !notificacao.ok) {
                      avisosOperacionais.push('Status atualizado, mas a mensagem ao cliente não foi enviada. Tente novamente pelo WhatsApp.')
                    }
                  }
                }
          '''),
          )

          Path("src/lib/afterResponse.ts").write_text(dedent('''\
            import { after } from "next/server";

            /**
             * Agenda um efeito para depois que a resposta HTTP já foi enviada.
             * Retorna false quando chamado fora de um contexto de request do Next
             * (principalmente testes unitários diretos), permitindo fallback seguro.
             */
            export function agendarTarefaAposResposta(tarefa: () => void | Promise<void>): boolean {
              try {
                after(async () => {
                  await tarefa();
                });
                return true;
              } catch {
                return false;
              }
            }
          '''), encoding="utf-8")

          Path("src/lib/mercadoPagoCancelamento.ts").write_text(dedent('''\
            import { resolveActiveMercadoPagoToken } from "./mercadoPagoIntegracao";
            import { buscarPagamentoMercadoPagoDetalhado } from "./mercadoPagoWebhook";

            const MP_PAYMENTS_URL = "https://api.mercadopago.com/v1/payments";
            const TIMEOUT_MS = 5_000;

            export type EstadoPagamentoMercadoPago = "pago" | "pendente" | "nao_cobravel" | "inconclusivo";

            export type ConsultaEstadoPagamentoMercadoPago = {
              estado: EstadoPagamentoMercadoPago;
              status?: string;
              motivo?: string;
            };

            export type ResultadoCancelamentoPagamentoMercadoPago = {
              estado: "cancelado" | "pago" | "ainda_pendente" | "nao_cobravel" | "inconclusivo";
              status?: string;
              motivo?: string;
            };

            function classificarStatus(statusBruto: string | undefined): ConsultaEstadoPagamentoMercadoPago {
              const status = String(statusBruto || "").trim().toLowerCase();
              if (status === "approved") return { estado: "pago", status };
              if (status === "pending" || status === "in_process" || status === "authorized") {
                return { estado: "pendente", status };
              }
              if (["cancelled", "canceled", "rejected", "refunded", "charged_back"].includes(status)) {
                return { estado: "nao_cobravel", status };
              }
              return { estado: "inconclusivo", ...(status ? { status } : {}), motivo: "status_desconhecido" };
            }

            export async function consultarEstadoPagamentoMercadoPago(paymentId: string): Promise<ConsultaEstadoPagamentoMercadoPago> {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
              try {
                const resultado = await buscarPagamentoMercadoPagoDetalhado(paymentId, controller.signal);
                if (!resultado.ok) return { estado: "inconclusivo", motivo: resultado.motivo };
                return classificarStatus(resultado.pagamento.status);
              } catch (error) {
                const timeout = error instanceof Error && error.name === "AbortError";
                return { estado: "inconclusivo", motivo: timeout ? "timeout" : "erro_consulta" };
              } finally {
                clearTimeout(timer);
              }
            }

            export async function cancelarPagamentoMercadoPagoPendente(paymentId: string): Promise<ResultadoCancelamentoPagamentoMercadoPago> {
              const token = await resolveActiveMercadoPagoToken();
              if (!token) return { estado: "inconclusivo", motivo: "token_indisponivel" };

              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
              try {
                const response = await fetch(`${MP_PAYMENTS_URL}/${encodeURIComponent(paymentId)}`, {
                  method: "PUT",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                  },
                  body: JSON.stringify({ status: "cancelled" }),
                  signal: controller.signal,
                });
                const data = await response.json().catch(() => null);
                if (response.ok) {
                  const classificado = classificarStatus(data?.status);
                  if (classificado.estado === "nao_cobravel") {
                    return { estado: "cancelado", status: classificado.status };
                  }
                  if (classificado.estado === "pago") return { estado: "pago", status: classificado.status };
                }
              } catch (error) {
                if (error instanceof Error && error.name === "AbortError") {
                  return { estado: "inconclusivo", motivo: "timeout_cancelamento" };
                }
                // Resultado de rede ambíguo: consulta o estado oficial abaixo antes
                // de decidir qualquer coisa sobre o pedido local.
              } finally {
                clearTimeout(timer);
              }

              const atual = await consultarEstadoPagamentoMercadoPago(paymentId);
              if (atual.estado === "pago") return { estado: "pago", status: atual.status };
              if (atual.estado === "pendente") return { estado: "ainda_pendente", status: atual.status };
              if (atual.estado === "nao_cobravel") return { estado: "nao_cobravel", status: atual.status };
              return { estado: "inconclusivo", motivo: atual.motivo, status: atual.status };
            }
          '''), encoding="utf-8")

          Path("src/lib/pixPagamentoTimeout.ts").write_text(dedent('''\
            import { redis } from "./redis";
            import { mutarPedidos } from "./pedidosConcorrencia";
            import type { PedidoComPix } from "./pix";
            import type { PedidoParaJornada } from "./jornadaChef";
            import {
              PIX_PAGAMENTO_AVISO_PENDENTE_MS,
              PIX_PAGAMENTO_CANCELAMENTO_MS,
              PIX_PAGAMENTO_RETRY_INCONCLUSIVO_MS,
            } from "./pixAutoCheckConfig";
            import {
              cancelarPagamentoMercadoPagoPendente,
              consultarEstadoPagamentoMercadoPago,
            } from "./mercadoPagoCancelamento";
            import { reconciliarPixMercadoPago } from "./mercadoPagoReconciliacao";
            import { enviarTextoWhatsApp } from "./whatsappMensagem";
            import { encerrarSentinela } from "./pixSentinela";
            import {
              calcularPontosElegiveisPedido,
              construirEventoIdPontos,
              derivarClienteIdPorTelefone,
              registrarMovimentoPontosIdempotente,
              reverterResgateConfirmado,
            } from "./fidelidade";
            import {
              liberarRecompensaDePedidoCancelado,
              reverterConclusaoPedidoJornada,
            } from "./jornadaChef";

            type PedidoTimeoutPix = PedidoComPix & PedidoParaJornada & {
              id: string;
              numero?: number;
              cliente?: string;
              telefone?: string;
              total?: number;
              taxaEntrega?: number;
              status?: string;
              resgateId?: string;
              cancelamentoSolicitado?: boolean;
              statusAtualizadoEm?: string;
            };

            export type ResultadoPoliticaTimeoutPix = {
              encerrado: boolean;
              motivo: string;
              proximoDelayMs?: number;
              avisoEnviado?: boolean;
              cancelado?: boolean;
            };

            const TTL_MARCADORES_SEGUNDOS = 24 * 60 * 60;
            const PREFIXO_AVISO = "pix:timeout:aviso:";
            const PREFIXO_LOCK_AVISO = "pix:timeout:lock:aviso:";
            const PREFIXO_CANCELADO = "pix:timeout:cancelado:";
            const PREFIXO_LOCK_CANCELAMENTO = "pix:timeout:lock:cancelamento:";

            function idadePixMs(pedido: PedidoTimeoutPix, agora: number): number | null {
              const criadoEm = pedido.pix?.criadoEm;
              if (!criadoEm) return null;
              const criado = new Date(criadoEm).getTime();
              if (!Number.isFinite(criado)) return null;
              return Math.max(0, agora - criado);
            }

            function pedidoElegivel(pedido: PedidoTimeoutPix | undefined): pedido is PedidoTimeoutPix {
              return !!(
                pedido &&
                pedido.status === "novo" &&
                pedido.pix?.provider === "mercadopago" &&
                pedido.pix?.providerPaymentId?.trim() &&
                pedido.pix?.status !== "confirmado" &&
                pedido.pixConfirmado !== true
              );
            }

            function telefoneWhatsapp(telefone: string | undefined): string | null {
              const digits = String(telefone || "").replace(/\D/g, "");
              if (digits.length < 10) return null;
              return digits.startsWith("55") ? digits : `55${digits}`;
            }

            function primeiroNome(cliente: string | undefined): string {
              return String(cliente || "Cliente").trim().split(/\s+/)[0] || "Cliente";
            }

            async function enviarAvisoPendente(pedido: PedidoTimeoutPix): Promise<boolean> {
              const marcador = `${PREFIXO_AVISO}${pedido.id}`;
              if (await redis.get(marcador)) return true;

              const lock = `${PREFIXO_LOCK_AVISO}${pedido.id}`;
              const ganhou = await redis.set(lock, "1", { nx: true, ex: 30 });
              if (!ganhou) return false;
              try {
                if (await redis.get(marcador)) return true;
                const phone = telefoneWhatsapp(pedido.telefone);
                if (!phone) {
                  await redis.set(marcador, "sem_telefone", { ex: TTL_MARCADORES_SEGUNDOS });
                  return true;
                }
                const nome = primeiroNome(pedido.cliente);
                const mensagem = `*${nome}*, seu pagamento Pix ainda está pendente. ⏳\n\nConclua o pagamento para manter seu pedido. O prazo total é de 13 minutos a partir da geração do Pix. Depois disso, o pedido é cancelado automaticamente.`;
                const resultado = await enviarTextoWhatsApp(phone, mensagem);
                if (!resultado.ok) return false;
                await redis.set(marcador, "enviado", { ex: TTL_MARCADORES_SEGUNDOS });
                return true;
              } finally {
                await redis.del(lock).catch(() => {});
              }
            }

            async function enviarCancelamentoAutomatico(pedido: PedidoTimeoutPix): Promise<void> {
              const phone = telefoneWhatsapp(pedido.telefone);
              if (!phone) return;
              const nome = primeiroNome(pedido.cliente);
              const mensagem = `*${nome}*, seu pedido foi cancelado automaticamente. ❌\n\nMotivo: o pagamento Pix não foi confirmado dentro do prazo de 13 minutos.\n\nO Pix pendente também foi encerrado para evitar pagamento depois do cancelamento. Se ainda quiser pedir, faça um novo pedido.`;
              const resultado = await enviarTextoWhatsApp(phone, mensagem);
              if (!resultado.ok) {
                console.error("[Pix timeout] Pedido cancelado, mas a mensagem ao cliente não foi enviada.", {
                  pedidoId: pedido.id,
                  motivo: resultado.motivo,
                });
              }
            }

            async function processarEfeitosCancelamento(pedido: PedidoTimeoutPix): Promise<void> {
              try {
                const clienteId = derivarClienteIdPorTelefone(pedido.telefone);
                const pontos = calcularPontosElegiveisPedido({
                  total: Number(pedido.total) || 0,
                  taxaEntrega: pedido.taxaEntrega,
                });
                if (clienteId && pontos > 0) {
                  await registrarMovimentoPontosIdempotente(clienteId, {
                    eventoId: construirEventoIdPontos(pedido.id, "cancelado"),
                    pedidoId: pedido.id,
                    tipo: "cancelado",
                    pontos,
                    motivo: `Pedido ${pedido.id} cancelado automaticamente por Pix não confirmado em 13 minutos`,
                  });
                }
              } catch (error) {
                console.error("[Pix timeout] Falha ao registrar cancelamento de pontos (ignorada).", error);
              }

              if (pedido.resgateId) {
                try {
                  const clienteId = derivarClienteIdPorTelefone(pedido.telefone);
                  if (clienteId) {
                    await reverterResgateConfirmado(
                      clienteId,
                      pedido.resgateId,
                      `Pedido ${pedido.id} cancelado automaticamente por Pix não confirmado`
                    );
                  }
                } catch (error) {
                  console.error("[Pix timeout] Falha ao reverter resgate (ignorada).", error);
                }
              }

              try {
                await reverterConclusaoPedidoJornada(pedido.id, `Pedido ${pedido.id} cancelado automaticamente por Pix não confirmado`);
                await liberarRecompensaDePedidoCancelado(pedido);
              } catch (error) {
                console.error("[Pix timeout] Falha ao reverter Jornada do Chef (ignorada).", error);
              }
            }

            async function confirmarSePagamentoAprovado(pedidoId: string): Promise<boolean> {
              const resumo = await reconciliarPixMercadoPago({ apenasPedidoIds: [pedidoId] });
              if (resumo.confirmados > 0) {
                await encerrarSentinela(pedidoId, "confirmado");
                return true;
              }
              return false;
            }

            export async function processarPoliticaTimeoutPagamentoPix(input: {
              pedidoId: string;
              agora?: number;
            }): Promise<ResultadoPoliticaTimeoutPix> {
              const agora = input.agora ?? Date.now();
              const pedidos = (await redis.get<PedidoTimeoutPix[]>("pedidos")) || [];
              const pedido = pedidos.find((item) => item.id === input.pedidoId);
              if (!pedidoElegivel(pedido)) return { encerrado: false, motivo: "pedido_nao_elegivel" };

              const idade = idadePixMs(pedido, agora);
              if (idade === null) return { encerrado: false, motivo: "idade_indeterminada" };
              if (idade < PIX_PAGAMENTO_AVISO_PENDENTE_MS) return { encerrado: false, motivo: "antes_do_aviso" };

              if (idade < PIX_PAGAMENTO_CANCELAMENTO_MS) {
                const marcadorAviso = await redis.get(`${PREFIXO_AVISO}${pedido.id}`);
                if (marcadorAviso) return { encerrado: false, motivo: "aviso_ja_processado" };

                const estado = await consultarEstadoPagamentoMercadoPago(pedido.pix.providerPaymentId as string);
                if (estado.estado === "pago") {
                  const confirmou = await confirmarSePagamentoAprovado(pedido.id);
                  if (confirmou) return { encerrado: true, motivo: "confirmado_no_marco_aviso" };
                  return { encerrado: false, motivo: "pago_aguardando_conciliacao", proximoDelayMs: 5_000 };
                }
                if (estado.estado === "nao_cobravel") {
                  await redis.set(`${PREFIXO_AVISO}${pedido.id}`, "nao_pendente", { ex: TTL_MARCADORES_SEGUNDOS });
                  return { encerrado: false, motivo: "pagamento_nao_pendente" };
                }
                if (estado.estado === "inconclusivo") {
                  return { encerrado: false, motivo: "consulta_inconclusiva_no_aviso", proximoDelayMs: PIX_PAGAMENTO_RETRY_INCONCLUSIVO_MS };
                }

                const enviado = await enviarAvisoPendente(pedido);
                return enviado
                  ? { encerrado: false, motivo: "aviso_enviado", avisoEnviado: true }
                  : { encerrado: false, motivo: "aviso_envio_falhou", proximoDelayMs: PIX_PAGAMENTO_RETRY_INCONCLUSIVO_MS };
              }

              const lockCancelamento = `${PREFIXO_LOCK_CANCELAMENTO}${pedido.id}`;
              const ganhouCancelamento = await redis.set(lockCancelamento, "1", { nx: true, ex: 30 });
              if (!ganhouCancelamento) {
                return { encerrado: false, motivo: "cancelamento_em_andamento", proximoDelayMs: 5_000 };
              }

              try {
                const resultadoProvider = await cancelarPagamentoMercadoPagoPendente(pedido.pix.providerPaymentId as string);
                if (resultadoProvider.estado === "pago") {
                  const confirmou = await confirmarSePagamentoAprovado(pedido.id);
                  if (confirmou) return { encerrado: true, motivo: "confirmado_no_marco_cancelamento" };
                  return { encerrado: false, motivo: "pago_aguardando_conciliacao", proximoDelayMs: 5_000 };
                }
                if (resultadoProvider.estado === "ainda_pendente" || resultadoProvider.estado === "inconclusivo") {
                  return { encerrado: false, motivo: "cancelamento_provider_inconclusivo", proximoDelayMs: PIX_PAGAMENTO_RETRY_INCONCLUSIVO_MS };
                }

                const mutacao = await mutarPedidos<PedidoTimeoutPix, { cancelado: boolean; pedido?: PedidoTimeoutPix; motivo: string }>((frescos) => {
                  const index = frescos.findIndex((item) => item.id === pedido.id);
                  if (index < 0) return { persistir: false, resultado: { cancelado: false, motivo: "pedido_nao_encontrado" } };
                  const atual = frescos[index];
                  if (!pedidoElegivel(atual) || atual.pix?.providerPaymentId !== pedido.pix?.providerPaymentId) {
                    return { persistir: false, resultado: { cancelado: false, pedido: atual, motivo: "estado_mudou" } };
                  }
                  const atualizado: PedidoTimeoutPix = {
                    ...atual,
                    status: "cancelado",
                    cancelamentoSolicitado: false,
                    statusAtualizadoEm: new Date(agora).toISOString(),
                  };
                  const proximos = [...frescos];
                  proximos[index] = atualizado;
                  return { persistir: true, pedidos: proximos, resultado: { cancelado: true, pedido: atualizado, motivo: "cancelado" } };
                });

                if (!mutacao.cancelado || !mutacao.pedido) {
                  if (mutacao.pedido?.pixConfirmado === true || mutacao.pedido?.pix?.status === "confirmado") {
                    await encerrarSentinela(pedido.id, "confirmado");
                    return { encerrado: true, motivo: "confirmado_durante_cancelamento" };
                  }
                  return { encerrado: false, motivo: mutacao.motivo, proximoDelayMs: 5_000 };
                }

                await redis.set(`${PREFIXO_CANCELADO}${pedido.id}`, new Date(agora).toISOString(), { ex: TTL_MARCADORES_SEGUNDOS });
                await processarEfeitosCancelamento(mutacao.pedido);
                await enviarCancelamentoAutomatico(mutacao.pedido);
                await encerrarSentinela(pedido.id, "cancelado");
                return { encerrado: true, motivo: "cancelado_pix_13_minutos", cancelado: true };
              } finally {
                await redis.del(lockCancelamento).catch(() => {});
              }
            }

            export async function processarTimeoutsPixPendentesEmLote(): Promise<{
              avaliados: number;
              avisos: number;
              cancelados: number;
              pendentesRetry: number;
            }> {
              const agora = Date.now();
              const pedidos = (await redis.get<PedidoTimeoutPix[]>("pedidos")) || [];
              const ids = pedidos
                .filter((pedido) => pedidoElegivel(pedido) && (idadePixMs(pedido, agora) ?? -1) >= PIX_PAGAMENTO_AVISO_PENDENTE_MS)
                .map((pedido) => pedido.id)
                .slice(0, 20);

              const resumo = { avaliados: 0, avisos: 0, cancelados: 0, pendentesRetry: 0 };
              for (const pedidoId of ids) {
                const resultado = await processarPoliticaTimeoutPagamentoPix({ pedidoId, agora });
                resumo.avaliados++;
                if (resultado.avisoEnviado) resumo.avisos++;
                if (resultado.cancelado) resumo.cancelados++;
                if (typeof resultado.proximoDelayMs === "number") resumo.pendentesRetry++;
              }
              return resumo;
            }
          '''), encoding="utf-8")

