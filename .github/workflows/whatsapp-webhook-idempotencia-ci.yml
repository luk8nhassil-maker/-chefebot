name: whatsapp-webhook-idempotencia-ci

on:
  pull_request:
    paths:
      - "src/app/api/whatsapp/route.ts"
      - "src/app/api/whatsapp/idempotenciaFalhaAposClaim.test.ts"
      - "src/app/api/whatsapp/duplicidadeSaudacaoConcorrente.test.ts"
      - ".github/workflows/whatsapp-webhook-idempotencia-ci.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-webhook-idempotencia-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do HEAD exato do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados de idempotência do webhook
        run: >-
          npm test --
          src/app/api/whatsapp/idempotenciaFalhaAposClaim.test.ts
          src/app/api/whatsapp/duplicidadeSaudacaoConcorrente.test.ts
          src/app/api/whatsapp/canaryInterception.test.ts

      # route.ts não entra aqui: é um arquivo legado de ~1900 linhas com erros
      # de lint pré-existentes (`no-explicit-any`) alheios a este patch — já
      # confirmado manualmente que o patch não introduz nenhum erro novo
      # (mesma contagem/linhas comparada com a main). Corrigi-los em massa
      # seria refatoração ampla fora do escopo deste fix.
      - name: Lint do arquivo de teste novo
        run: >-
          npm run lint --
          src/app/api/whatsapp/idempotenciaFalhaAposClaim.test.ts

      - name: Typecheck comparado com a main
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit > /tmp/typecheck-branch.log 2>&1
          branch_status=$?
          set -e

          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then
            git fetch --depth=1 origin main
            base_sha="origin/main"
          else
            git fetch --depth=1 origin "$base_sha"
          fi

          git worktree add --detach /tmp/chefebot-main "$base_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chefebot-main/node_modules
          set +e
          (cd /tmp/chefebot-main && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit) > /tmp/typecheck-main.log 2>&1
          main_status=$?
          set -e

          sed -E 's#^([^(:]+\([^)]*\): error TS[0-9]+:).*#\1#' /tmp/typecheck-branch.log | grep 'error TS' | sort -u > /tmp/branch-errors.txt || true
          sed -E 's#^([^(:]+\([^)]*\): error TS[0-9]+:).*#\1#' /tmp/typecheck-main.log | grep 'error TS' | sort -u > /tmp/main-errors.txt || true
          comm -13 /tmp/main-errors.txt /tmp/branch-errors.txt > /tmp/new-errors.txt

          if [ -s /tmp/new-errors.txt ]; then
            echo "::error::A branch introduziu novos erros de typecheck em relação à main:"
            cat /tmp/new-errors.txt
            exit 1
          fi

          if [ "$branch_status" -ne 0 ]; then
            echo "Typecheck global permanece vermelho somente por erros já presentes na main (main status=$main_status)."
          else
            echo "Typecheck da branch totalmente verde."
          fi

      - name: Build de produção
        run: npm run build
