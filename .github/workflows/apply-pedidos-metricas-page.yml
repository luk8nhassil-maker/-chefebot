name: Apply pedidos metrics page patch

on:
  push:
    branches:
      - fix/pedidos-metricas-pizzas-preparo

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[metrics-page-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedidos-metricas-pizzas-preparo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic page patch
        run: node scripts/apply-pedidos-metricas-page.mjs
      - name: Commit page patch
        run: |
          if git diff --quiet -- src/app/pedidos/page.tsx; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pedidos/page.tsx
          git commit -m "feat: mostra pizzas e média real de preparo [metrics-page-applied]"
          git push origin HEAD:fix/pedidos-metricas-pizzas-preparo
