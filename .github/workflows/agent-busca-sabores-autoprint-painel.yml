                  raise SystemExit(f'{path}: anchor expected once, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_after(path: str, anchor: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'{path}: section anchor not found: {anchor!r}')
              before, after = text[:pos], text[pos:]
              count = after.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: target after anchor not found: {old[:120]!r}')
              after = after.replace(old, new, 1)
