          route_new.write_text('''import { NextRequest, NextResponse } from "next/server";
import { redis } from "@/lib/redis";
import { reivindicarImpressaoAutomatica } from "@/lib/impressaoAutomatica";
import { ehOrigemAdministrativa, lerSessaoAdministrativa } from "@/lib/sessaoAdministrativa";

type PedidoPainel = {
  id?: string;
  origem?: unknown;
  pagamento?: string;
  pixConfirmado?: boolean;
  pix?: { status?: string };
  status?: string;
  isArchived?: boolean;
};

function pagamentoTemPix(pagamento: unknown): boolean {
  return typeof pagamento === "string" && /\\bpix\\b/i.test(pagamento);
}

function pixEstaConfirmado(pedido: PedidoPainel): boolean {
  return pedido.pixConfirmado === true || pedido.pix?.status === "confirmado";
}

export async function POST(req: NextRequest) {
  const sessao = await lerSessaoAdministrativa(req);
  if (!sessao) return NextResponse.json({ ok: false, error: "Nao autorizado" }, { status: 401 });

  const body = await req.json().catch(() => null) as { id?: unknown } | null;
  const id = typeof body?.id === "string" ? body.id.trim() : "";
  if (!id) return NextResponse.json({ ok: false, error: "Pedido invalido" }, { status: 400 });

  const pedidos = (await redis.get<PedidoPainel[]>("pedidos")) || [];
  const pedido = pedidos.find((item) => item?.id === id);
  if (!pedido) return NextResponse.json({ ok: false, error: "Pedido nao encontrado" }, { status: 404 });

  // Regra exclusiva do Novo Pedido do painel. A origem foi derivada de uma
  // sessao autenticada no servidor na criacao; nunca confiamos em um campo
  // enviado pelo navegador para liberar impressao.
  if (!ehOrigemAdministrativa(pedido.origem)) {
    return NextResponse.json({ ok: true, podeImprimirAutomaticamente: false, motivo: "origem_nao_painel" });
  }

  if (pedido.isArchived || pedido.status === "cancelado" || pedido.status === "entregue") {
    return NextResponse.json({ ok: true, podeImprimirAutomaticamente: false, motivo: "pedido_finalizado" });
  }

  // Qualquer pagamento que contenha Pix (inclusive misto Pix + Dinheiro)
  // precisa estar confirmado antes de liberar a cozinha. Importante: quando
  // ainda esta pendente, NAO consumimos o claim — a confirmacao posterior
  // ainda podera reivindicar a unica impressao automatica permitida.
  if (pagamentoTemPix(pedido.pagamento) && !pixEstaConfirmado(pedido)) {
    return NextResponse.json({ ok: true, podeImprimirAutomaticamente: false, motivo: "pix_pendente" });
  }

  const podeImprimirAutomaticamente = await reivindicarImpressaoAutomatica(id);
  return NextResponse.json({
    ok: true,
    podeImprimirAutomaticamente,
    ...(!podeImprimirAutomaticamente ? { motivo: "ja_reivindicado" } : {}),
  });
}
''', encoding='utf-8')

          test_route = Path('src/app/api/orders/auto-print-painel/route.test.ts')
          test_route.write_text('''import { beforeEach, describe, expect, test, vi } from "vitest";
import { NextRequest } from "next/server";

const { store, redisMock, sessaoMock } = vi.hoisted(() => {
  const store = new Map<string, unknown>();
  const redisMock = {
    get: vi.fn(async (key: string) => store.get(key) ?? null),
    set: vi.fn(async (key: string, value: unknown, opts?: { nx?: boolean }) => {
      if (opts?.nx && store.has(key)) return null;
      store.set(key, value);
      return "OK";
    }),
  };
  const sessaoMock = vi.fn(async () => ({ username: "kellyne", nome: "Kellyne", role: "admin" }));
  return { store, redisMock, sessaoMock };
});

vi.mock("@/lib/redis", () => ({ redis: redisMock }));
vi.mock("@/lib/sessaoAdministrativa", () => ({
  lerSessaoAdministrativa: sessaoMock,
  ehOrigemAdministrativa: (origem: unknown) => origem === "painel",
}));

import { POST } from "./route";

function req(id = "ped_1") {
  return new NextRequest("http://localhost/api/orders/auto-print-painel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  });
}

function seed(overrides: Record<string, unknown> = {}) {
  store.set("pedidos", [{ id: "ped_1", origem: "painel", status: "novo", pagamento: "Dinheiro", ...overrides }]);
}

beforeEach(() => {
  store.clear();
  vi.clearAllMocks();
  sessaoMock.mockResolvedValue({ username: "kellyne", nome: "Kellyne", role: "admin" });
});

describe("POST /api/orders/auto-print-painel", () => {
  test("exige sessao administrativa real", async () => {
    sessaoMock.mockResolvedValueOnce(null);
    expect((await POST(req())).status).toBe(401);
  });

  test("pedido do site nunca usa a regra especial do painel", async () => {
    seed({ origem: "site" });
    const data = await (await POST(req())).json();
    expect(data).toMatchObject({ podeImprimirAutomaticamente: false, motivo: "origem_nao_painel" });
    expect(store.has("pedido:auto-print-claim:ped_1")).toBe(false);
  });

  test("pedido do painel sem Pix imprime imediatamente e apenas uma vez", async () => {
    seed({ pagamento: "Cartao" });
    const primeira = await (await POST(req())).json();
    const segunda = await (await POST(req())).json();
    expect(primeira.podeImprimirAutomaticamente).toBe(true);
    expect(segunda.podeImprimirAutomaticamente).toBe(false);
  });

  test("Pix pendente nao imprime e nao consome o claim", async () => {
    seed({ pagamento: "Pix", pixConfirmado: false, pix: { status: "pendente" } });
    const data = await (await POST(req())).json();
    expect(data).toMatchObject({ podeImprimirAutomaticamente: false, motivo: "pix_pendente" });
    expect(store.has("pedido:auto-print-claim:ped_1")).toBe(false);
  });

  test("Pix confirmado libera a mesma impressao unica", async () => {
    seed({ pagamento: "Pix", pixConfirmado: true, pix: { status: "confirmado" } });
    const data = await (await POST(req())).json();
    expect(data.podeImprimirAutomaticamente).toBe(true);
    expect(store.has("pedido:auto-print-claim:ped_1")).toBe(true);
  });

  test("pagamento misto contendo Pix tambem aguarda confirmacao", async () => {
    seed({ pagamento: "Pix (R$ 20,00) + Dinheiro (R$ 30,00)", pixConfirmado: false });
    const data = await (await POST(req())).json();
    expect(data.motivo).toBe("pix_pendente");
  });

  test("pedido finalizado ou arquivado nunca dispara", async () => {
    seed({ status: "cancelado" });
    expect((await (await POST(req())).json()).podeImprimirAutomaticamente).toBe(false);
    store.clear();
    seed({ isArchived: true });
    expect((await (await POST(req())).json()).podeImprimirAutomaticamente).toBe(false);
  });
});
''', encoding='utf-8')

