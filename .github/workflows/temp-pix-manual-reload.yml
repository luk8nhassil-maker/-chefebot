name: temp-pix-manual-reload

on:
  push:
    branches:
      - fix/pedidos-pix-manual-reload-20260822
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-e-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Provar a regressão antes do patch
        shell: bash
        run: |
          set +e
          npx vitest run src/app/pedidos/pixManualReload.regression.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "O teste de regressão passou antes do patch; não é seguro continuar."
            exit 1
          fi
          echo "Regressão reproduzida: a confirmação manual ainda não recarrega o painel."

      - name: Aplicar o menor patch seguro
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/pedidos/page.tsx")
          fonte = path.read_text(encoding="utf-8")
          antigo = '''        setPixConfirmando(false)
                  resetarVerificacaoPix()
                  return'''
          novo = '''        setPixConfirmando(false)
                  resetarVerificacaoPix()
                  // A confirmação financeira já foi persistida no servidor. Recarregar
                  // aqui reproduz automaticamente o F5 que hoje restaura a lista inteira,
                  // sem repetir a confirmação nem alterar qualquer regra de Pix.
                  window.location.reload()
                  return'''
          ocorrencias = fonte.count(antigo)
          if ocorrencias != 1:
              raise SystemExit(f"Bloco esperado encontrado {ocorrencias} vez(es); abortando patch para não tocar no lugar errado.")
          path.write_text(fonte.replace(antigo, novo, 1), encoding="utf-8")

      - name: Testes focados do Pix manual e painel
        run: |
          npx vitest run \
            src/app/pedidos/pixManualReload.regression.test.ts \
            src/app/pedidos/pixModalFechamento.regression.test.ts \
            src/app/pedidos/pixSeguranca.page.test.ts \
            src/app/pedidos/page.test.ts

      - name: Lint somente do patch
        run: npx eslint src/app/pedidos/page.tsx src/app/pedidos/pixManualReload.regression.test.ts

      - name: Comparar typecheck com a main base
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/branch-tsc.txt 2>&1
          branch_status=$?
          set -e
          git worktree add --detach /tmp/chefebot-main 13c3079293468460172bd29821b297fe60c3429e
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chefebot-main/node_modules
          cd /tmp/chefebot-main
          set +e
          npx tsc --noEmit --pretty false > /tmp/main-tsc.txt 2>&1
          main_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          branch_errors=$(grep -c 'error TS[0-9]' /tmp/branch-tsc.txt || true)
          main_errors=$(grep -c 'error TS[0-9]' /tmp/main-tsc.txt || true)
          echo "main: status=$main_status erros=$main_errors"
          echo "branch: status=$branch_status erros=$branch_errors"
          if [ "$branch_errors" -gt "$main_errors" ]; then
            echo "A branch introduziu novos erros de TypeScript."
            cat /tmp/branch-tsc.txt
            exit 1
          fi

      - name: Build de produção
        run: npm run build

      - name: Conferir diff e remover executor temporário
        shell: bash
        run: |
          git diff --check
          git diff -- src/app/pedidos/page.tsx src/app/pedidos/pixManualReload.regression.test.ts
          git rm .github/workflows/temp-pix-manual-reload.yml

      - name: Persistir somente o patch validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pedidos/page.tsx .github/workflows/temp-pix-manual-reload.yml
          git commit -m "fix(pedidos): recarrega painel após confirmar Pix manual"
          git push origin HEAD:fix/pedidos-pix-manual-reload-20260822
