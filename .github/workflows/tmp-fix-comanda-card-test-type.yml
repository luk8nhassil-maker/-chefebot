name: tmp-fix-comanda-card-test-type

on:
  push:
    branches:
      - fix/salao-comanda-card-pedidos-ux-20260820

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/salao-comanda-card-pedidos-ux-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corrigir somente as fixtures dos testes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/salao/page.test.tsx')
          text = p.read_text()
          for old in (', totalParcial: 77', ', totalParcial: 10', ', totalParcial: 12'):
              if text.count(old) != 1:
                  raise SystemExit(f'fixture inesperada: {old} -> {text.count(old)}')
              text = text.replace(old, '', 1)
          p.write_text(text)
      - name: Validar regressões do Salão
        run: npx vitest run src/app/salao/page.test.tsx
      - name: Garantir zero erro de TypeScript novo no teste do Salão
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          set -e
          if grep -q '^src/app/salao/page.test.tsx.*error TS' /tmp/tsc.log; then
            grep '^src/app/salao/page.test.tsx.*error TS' /tmp/tsc.log
            exit 1
          fi
      - name: Lint do teste alterado
        run: npx eslint src/app/salao/page.test.tsx
      - name: Publicar correção mínima
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-comanda-card-test-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(salao): usa total calculado nas fixtures"
          git push origin HEAD:fix/salao-comanda-card-pedidos-ux-20260820
