          publico_test = "src/app/cardapio/page.test.ts"
          with Path(publico_test).open("a") as f:
              f.write('''\n\ndescribe("/cardapio — opcionais sem beco sem saída", () => {\n  test("pizza pergunta Sim/Não para borda e adicionais antes de abrir as listas", () => {\n    expect(fonte).toContain('screen === "sc-border"');\n    expect(fonte).toContain('Vai querer borda?');\n    expect(fonte).toContain('screen === "sc-addons-question"');\n    expect(fonte).toContain('Vai querer adicionais?');\n  });\n\n  test("após Sim, CTA sem seleção fica ativo como Sem borda/Sem adicionais e vira Continuar ao selecionar", () => {\n    expect(fonte).toContain('{border ? "Continuar" : "Sem borda"}');\n    expect(fonte).toContain('{addOnIds.length > 0 ? "Continuar" : "Sem adicionais"}');\n    expect(fonte).toContain('selecionarBorda(b.label');\n    expect(fonte).not.toContain('<div className="opt-title">Sem borda</div>');\n  });\n\n  test("macarronada usa a mesma pergunta e permite Sem adicional/Continuar sem opção Nenhum na lista", () => {\n    expect(fonte).toContain('screen === "sc-macarronada-addon-question"');\n    expect(fonte).toContain('{macarronadaAddOnEscolhido ? "Continuar" : "Sem adicional"}');\n    const bloco = fonte.slice(fonte.indexOf('screen === "sc-macarronada-addon"'), fonte.indexOf('screen === "sc-delivery"'));\n    expect(bloco).not.toContain('<div className="opt-title">Nenhum</div>');\n  });\n});\n''')

