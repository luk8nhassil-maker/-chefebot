              '''          {screen === "sc-border" && (\n            <section className="screen active">\n              <TopBack onClick={() => go("sc-build")} title="Borda" />\n              <PizzaCtx badge={ctxBadge} txt={ctxTxt} dots={ctxDots} />\n              <div className="screen-head"><h2>Vai querer borda?</h2><p>Escolha Sim ou Não.</p></div>\n              <div className="grid2">\n                <button className="btn" onClick={() => go("sc-border-options")}>Sim</button>\n                <button className="btn btn-ghost" onClick={() => chooseBorder(null, 0)}>Não</button>\n              </div>\n            </section>\n          )}\n          {screen === "sc-border-options" && (\n            <section className="screen active">\n              <TopBack onClick={() => go("sc-border")} title="Borda" />\n              <PizzaCtx badge={ctxBadge} txt={ctxTxt} dots={ctxDots} />\n              <div className="screen-head"><h2>Escolha a borda</h2><p>Se mudar de ideia, use o botão abaixo para continuar sem borda.</p></div>\n              {menu.pizzaCatalog\n                ? menu.pizzaCatalog.borders.map((b) => {\n                    const p = b.pricesBySizeCode[size as "P" | "M" | "G" | "F"];\n                    if (p === undefined) return null;\n                    const esg = !b.available;\n                    const precoReais = p / 100;\n                    return (\n                      <div key={b.id} className={`opt ${border === b.label ? "sel" : ""}`} onClick={() => !esg && selecionarBorda(b.label, precoReais)} style={{ opacity: esg ? 0.5 : 1, cursor: esg ? "not-allowed" : "pointer" }} {...optA11yAttrs(esg)} onKeyDown={(e) => { if (!esg && isActivateKey(e)) { e.preventDefault(); selecionarBorda(b.label, precoReais); } }}>\n                        <div className="opt-emoji">🧀</div><div className="opt-body"><div className="opt-title">{b.label}</div>{esg && <div className="opt-desc" style={{ color: "var(--danger)" }}>Esgotado</div>}</div><div className="opt-price">{esg ? "" : `+${money(precoReais)}`}</div><div className="opt-check" />\n                      </div>\n                    );\n                  })\n                : (menu.borders || []).map((b, i) => { const p = bigBorder(size!) ? b.priceLarge : b.priceSmall; const esg = esgotados.includes(b.label); return (<div key={i} className={`opt ${border === b.label ? "sel" : ""}`} onClick={() => !esg && selecionarBorda(b.label, p)} style={{ opacity: esg ? 0.5 : 1, cursor: esg ? "not-allowed" : "pointer" }} {...optA11yAttrs(esg)} onKeyDown={(e) => { if (!esg && isActivateKey(e)) { e.preventDefault(); selecionarBorda(b.label, p); } }}><div className="opt-emoji">🧀</div><div className="opt-body"><div className="opt-title">{b.label}</div>{esg && <div className="opt-desc" style={{ color: "var(--danger)" }}>Esgotado</div>}</div><div className="opt-price">{esg ? "" : `+${money(p)}`}</div><div className="opt-check" /></div>); })}\n              <div className="build-foot">\n                <div className="build-foot-hint">{border ? `Borda: ${border}` : "Nenhuma borda selecionada"}</div>\n                <button className="btn" onClick={() => chooseBorder(border, borderPrice)}>{border ? "Continuar" : "Sem borda"}</button>\n              </div>\n            </section>\n          )}\n          {screen === "sc-addons-question" && (\n            <section className="screen active">\n              <TopBack onClick={() => go(border ? "sc-border-options" : "sc-border")} title="Adicionais" />\n              <PizzaCtx badge={ctxBadge} txt={ctxTxt} dots={ctxDots} />\n              <div className="screen-head"><h2>Vai querer adicionais?</h2><p>Escolha Sim ou Não.</p></div>\n              <div className="grid2">\n                <button className="btn" onClick={() => go("sc-addons")}>Sim</button>\n                <button className="btn btn-ghost" onClick={() => { setAddOnIds([]); finalizarPizza(border, borderPrice, []); }}>Não</button>\n              </div>\n            </section>\n          )}\n          {screen === "sc-addons" && ('''
