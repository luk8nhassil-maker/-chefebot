          transversal.write_text('''import { describe, expect, test } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\n\nconst salao = readFileSync(resolve("src/app/salao/page.tsx"), "utf8");\nconst manual = readFileSync(resolve("src/app/pedidos/NovoPedidoManual.tsx"), "utf8");\nconst publico = readFileSync(resolve("src/app/cardapio/page.tsx"), "utf8");\n\ndescribe("opcionais uniformes nos três fluxos", () => {\n  test("Salão e pedido manual mantêm Sim/Não e CTA Sem adicionais quando vazio", () => {\n    for (const fonte of [salao, manual]) {\n      expect(fonte).toContain("Vai querer adicionais?");\n      expect(fonte).toContain('"Sem adicionais"');\n      expect(fonte).toContain('"Continuar"');\n    }\n  });\n  test("cardápio público aplica a mesma decisão a borda/adicionais/macarronada", () => {\n    expect(publico).toContain("Vai querer borda?");\n    expect(publico).toContain("Vai querer adicionais?");\n    expect(publico).toContain("Vai querer adicional?");\n    expect(publico).toContain('"Sem adicionais"');\n  });\n  test("Salão e manual exibem emojis por categoria e opção", () => {\n    for (const fonte of [salao, manual]) {\n      for (const emoji of ["🍕", "🥟", "🍔", "🍝", "🥤", "🧃", "🥛", "🧀", "➕"]) expect(fonte).toContain(emoji);\n    }\n  });\n});\n''')

