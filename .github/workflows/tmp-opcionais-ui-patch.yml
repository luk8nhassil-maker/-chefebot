name: tmp-opcionais-ui-patch

on:
  push:
    branches:
      - feat/opcionais-sem-saida-emojis

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opcionais-sem-saida-emojis
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Aplicar patch mínimo
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 trecho, encontrado {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, repl: str):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex deveria casar 1 vez, casou {count}: {pattern[:120]!r}")
              p.write_text(new)

          # -----------------------------------------------------------------
          # SALÃO: preserva Sim/Não, elimina beco sem saída após o Sim e
          # acrescenta emojis vindos da mesma linguagem visual do cardápio.
          # -----------------------------------------------------------------
          salao = "src/app/salao/page.tsx"
          replace_once(
              salao,
              'const FONT = "\'Archivo\', sans-serif"\n',
              '''const FONT = "'Archivo', sans-serif"\nconst EMOJI_CATEGORIA_PEDIDO: Record<CategoriaManual, string> = {\n  pizza: "🍕",\n  calzone: "🥟",\n  pastelForno: "🥟",\n  lanches: "🍔",\n  hamburgueres: "🍔",\n  macarronada: "🍝",\n  bebidas: "🥤",\n  sucos: "🧃",\n  vitaminas: "🥛",\n}\n\nfunction emojiOpcaoMontagem(tipo: string | undefined, categoria: CategoriaManual): string {\n  if (tipo === "borda") return "🧀"\n  if (tipo === "adicionais" || tipo === "adicional_opcional") return "➕"\n  if (tipo === "leite") return "🥛"\n  return EMOJI_CATEGORIA_PEDIDO[categoria]\n}\n'''
          )

          sub_once(
              salao,
              r'  const bloqueioOpcional = mostrarPerguntaOpcional.*?  const perguntaOpcional = etapaAtual\?\.tipo === "borda"',
              '''  const bloqueio = mostrarPerguntaOpcional ? null : motivoBloqueio(etapaAtual, selecao)\n  const opcionalTemSelecao = etapaAtual?.tipo === "borda"\n    ? !!selecao.borda\n    : etapaAtual?.tipo === "adicionais"\n      ? (selecao.adicionais?.length ?? 0) > 0\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? !!selecao.adicionalOpcional\n        : false\n  const rotuloCtaOpcional = etapaAtual?.tipo === "borda"\n    ? (opcionalTemSelecao ? "Continuar" : "Sem borda")\n    : etapaAtual?.tipo === "adicionais"\n      ? (opcionalTemSelecao ? "Continuar" : "Sem adicionais")\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? (opcionalTemSelecao ? "Continuar" : "Sem adicional")\n        : "Continuar"\n  const perguntaOpcional = etapaAtual?.tipo === "borda"'''
          )

          replace_once(
              salao,
              '''  function avancarEtapa() {\n    if (!etapaAtual || mostrarPerguntaOpcional || bloqueio) return\n    if (!etapaOpcional && !etapaSatisfeita(etapaAtual, selecao)) return\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagem(selecao)\n  }\n''',
              '''  function normalizarOpcionalSemEscolha(atual: SelecaoMontagem): SelecaoMontagem {\n    if (!etapaAtual || !etapaOpcional) return atual\n    if (etapaAtual.tipo === "borda" && !atual.borda) return { ...atual, borda: null }\n    if (etapaAtual.tipo === "adicionais" && (atual.adicionais?.length ?? 0) === 0) return { ...atual, adicionais: [] }\n    if (etapaAtual.tipo === "adicional_opcional" && !atual.adicionalOpcional) return { ...atual, adicionalOpcional: null }\n    return atual\n  }\n\n  function avancarEtapa() {\n    if (!etapaAtual || mostrarPerguntaOpcional || bloqueio) return\n    if (!etapaOpcional && !etapaSatisfeita(etapaAtual, selecao)) return\n    const selecaoFinal = etapaOpcional ? normalizarOpcionalSemEscolha(selecao) : selecao\n    if (selecaoFinal !== selecao) setSelecao(selecaoFinal)\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagem(selecaoFinal)\n  }\n'''
          )

          replace_once(
              salao,
              '              {c.label}\n            </button>',
              '              {EMOJI_CATEGORIA_PEDIDO[c.id]} {c.label}\n            </button>'
          )
          replace_once(
              salao,
              '<span style={{ fontSize: 14, fontWeight: 800, color: "var(--foreground)" }}>{p.nome}{p.esgotado ? " · esgotado" : ""}</span>',
              '<span style={{ fontSize: 14, fontWeight: 800, color: "var(--foreground)" }}>{EMOJI_CATEGORIA_PEDIDO[p.categoria]} {p.nome}{p.esgotado ? " · esgotado" : ""}</span>'
          )
          replace_once(
              salao,
              '<span style={{ fontSize: 14, fontWeight: 800, color: "var(--foreground)" }}>{o.label}{o.esgotado ? " · esgotado" : ""}</span>',
              '<span style={{ fontSize: 14, fontWeight: 800, color: "var(--foreground)" }}>{emojiOpcaoMontagem(etapaAtual.tipo, produtoAberto.categoria)} {o.label}{o.esgotado ? " · esgotado" : ""}</span>'
          )
          replace_once(
              salao,
              '{etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Adicionar"}',
              '{etapaOpcional ? rotuloCtaOpcional : etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Adicionar"}'
          )

          # Atualiza testes de interação do Salão para provar a mudança de ideia.
          salao_test = "src/app/salao/page.test.tsx"
          replace_once(
              salao_test,
              '  it("Sim revela somente as opções reais de borda/adicionais e exige escolha", async () => {',
              '  it("Sim revela as opções e permite continuar sem marcar nada se a pessoa mudar de ideia", async () => {'
          )
          replace_once(
              salao_test,
              '''    expect(await screen.findByRole("button", { name: /Catupiry/ })).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Sem borda" })).not.toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Continuar para adicionais" })).toBeDisabled();\n    await user.click(screen.getByRole("button", { name: /Catupiry/ }));\n    await user.click(screen.getByRole("button", { name: "Continuar para adicionais" }));\n\n    expect(await screen.findByText("Vai querer adicionais?")).toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Sim" }));\n    expect(await screen.findByRole("button", { name: /Bacon/ })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Adicionar" })).toBeDisabled();\n    await user.click(screen.getByRole("button", { name: /Bacon/ }));\n    await user.click(screen.getByRole("button", { name: "Adicionar" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getAllByText("R$ 45,00").length).toBeGreaterThan(0);\n''',
              '''    expect(await screen.findByRole("button", { name: /Catupiry/ })).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Sem borda" })).not.toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Sem borda" })).toBeEnabled();\n    await user.click(screen.getByRole("button", { name: "Sem borda" }));\n\n    expect(await screen.findByText("Vai querer adicionais?")).toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Sim" }));\n    expect(await screen.findByRole("button", { name: /Bacon/ })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Sem adicionais" })).toBeEnabled();\n    await user.click(screen.getByRole("button", { name: "Sem adicionais" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getAllByText("R$ 33,00").length).toBeGreaterThan(0);\n'''
          )
          replace_once(
              salao_test,
              '    await user.click(screen.getByRole("button", { name: "Adicionar" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getAllByText("R$ 35,00").length).toBeGreaterThan(0);',
              '    expect(screen.getByRole("button", { name: "Continuar" })).toBeEnabled();\n    await user.click(screen.getByRole("button", { name: "Continuar" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getAllByText("R$ 35,00").length).toBeGreaterThan(0);'
          )

          # -----------------------------------------------------------------
          # PEDIDO MANUAL: recebe o mesmo Sim/Não + CTA reversível do Salão.
          # -----------------------------------------------------------------
          manual = "src/app/pedidos/NovoPedidoManual.tsx"
          replace_once(manual, '  resumoEtapa,\n  alternarSabor,', '  resumoEtapa,\n  alternarAdicional,\n  alternarSabor,')
          replace_once(
              manual,
              '''const ICONE_CATEGORIA: Record<CategoriaManual, LucideIcon> = {\n  pizza: Pizza,\n  calzone: UtensilsCrossed,\n  pastelForno: Croissant,\n  lanches: Sandwich,\n  hamburgueres: Beef,\n  macarronada: Soup,\n  bebidas: CupSoda,\n  sucos: GlassWater,\n  vitaminas: Milk,\n}\n''',
              '''const ICONE_CATEGORIA: Record<CategoriaManual, LucideIcon> = {\n  pizza: Pizza,\n  calzone: UtensilsCrossed,\n  pastelForno: Croissant,\n  lanches: Sandwich,\n  hamburgueres: Beef,\n  macarronada: Soup,\n  bebidas: CupSoda,\n  sucos: GlassWater,\n  vitaminas: Milk,\n}\nconst EMOJI_CATEGORIA: Record<CategoriaManual, string> = {\n  pizza: "🍕",\n  calzone: "🥟",\n  pastelForno: "🥟",\n  lanches: "🍔",\n  hamburgueres: "🍔",\n  macarronada: "🍝",\n  bebidas: "🥤",\n  sucos: "🧃",\n  vitaminas: "🥛",\n}\nfunction emojiOpcaoMontagemManual(tipo: string | undefined, categoria: CategoriaManual): string {\n  if (tipo === "borda") return "🧀"\n  if (tipo === "adicionais" || tipo === "adicional_opcional") return "➕"\n  if (tipo === "leite") return "🥛"\n  return EMOJI_CATEGORIA[categoria]\n}\n'''
          )
          replace_once(manual, '            <Icone size={14} aria-hidden="true" />\n            {c.label}', '            <span aria-hidden="true">{EMOJI_CATEGORIA[c.id]}</span>\n            <Icone size={14} aria-hidden="true" />\n            {c.label}')
          replace_once(manual, '  const [etapaVisivel, setEtapaVisivel] = useState(0)\n', '  const [etapaVisivel, setEtapaVisivel] = useState(0)\n  const [opcionaisAbertas, setOpcionaisAbertas] = useState<Set<number>>(() => new Set())\n')
          replace_once(
              manual,
              '  const etapaAtual = etapas[etapaVisivel]\n',
              '  const etapaAtual = etapas[etapaVisivel]\n  const etapaOpcional = etapaAtual?.tipo === "borda" || etapaAtual?.tipo === "adicionais" || etapaAtual?.tipo === "adicional_opcional"\n  const opcionalAberta = !!etapaOpcional && opcionaisAbertas.has(etapaVisivel)\n  const mostrarPerguntaOpcional = !!etapaOpcional && !opcionalAberta\n'
          )
          replace_once(
              manual,
              '  const etapaTemBusca = (etapaAtual?.tipo === "sabores" || etapaAtual?.tipo === "sabor_unico") && (etapaAtual?.opcoes.length ?? 0) > 6\n',
              '  const opcoesEtapaVisiveis = etapaAtual\n    ? etapaAtual.opcoes.filter((o) => !((etapaAtual.tipo === "borda" || etapaAtual.tipo === "adicional_opcional") && o.valor === ""))\n    : []\n  const etapaTemBusca = !mostrarPerguntaOpcional && (etapaAtual?.tipo === "sabores" || etapaAtual?.tipo === "sabor_unico") && opcoesEtapaVisiveis.length > 6\n'
          )
          sub_once(
              manual,
              r'  const opcoesEtapaFiltradas = etapaAtual\n    \? \(termoEtapaNorm.*?    : \[\]\n  const bloqueio = motivoBloqueio\(etapaAtual, selecao\)',
              '''  const opcoesEtapaFiltradas = mostrarPerguntaOpcional\n    ? []\n    : (termoEtapaNorm\n        ? opcoesEtapaVisiveis.filter((o) => norm(o.label).includes(termoEtapaNorm) || (o.ingredientes ? norm(o.ingredientes).includes(termoEtapaNorm) : false))\n        : opcoesEtapaVisiveis)\n  const bloqueio = mostrarPerguntaOpcional ? null : motivoBloqueio(etapaAtual, selecao)'''
          )
          replace_once(
              manual,
              '  const tipoControleEtapa: "radio" | "checkbox" = etapaAtual?.tipo === "sabores" ? "checkbox" : "radio"\n',
              '''  const tipoControleEtapa: "radio" | "checkbox" = etapaAtual?.tipo === "sabores" || etapaAtual?.tipo === "adicionais" ? "checkbox" : "radio"\n  const perguntaOpcional = etapaAtual?.tipo === "borda"\n    ? "Vai querer borda?"\n    : etapaAtual?.tipo === "adicionais"\n      ? "Vai querer adicionais?"\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? "Vai querer adicional?"\n        : null\n  const ajudaEtapa = mostrarPerguntaOpcional\n    ? "Escolha Sim ou Não."\n    : etapaAtual?.tipo === "borda"\n      ? "Escolha a borda ou continue sem borda."\n      : etapaAtual?.tipo === "adicionais"\n        ? "Escolha um ou mais adicionais, ou continue sem adicionais."\n        : etapaAtual?.tipo === "adicional_opcional"\n          ? "Escolha 1 adicional, ou continue sem adicional."\n          : etapaAtual?.ajuda\n  const opcionalTemSelecao = etapaAtual?.tipo === "borda"\n    ? !!selecao.borda\n    : etapaAtual?.tipo === "adicionais"\n      ? (selecao.adicionais?.length ?? 0) > 0\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? !!selecao.adicionalOpcional\n        : false\n  const rotuloCtaOpcional = etapaAtual?.tipo === "borda"\n    ? (opcionalTemSelecao ? "Continuar" : "Sem borda")\n    : etapaAtual?.tipo === "adicionais"\n      ? (opcionalTemSelecao ? "Continuar" : "Sem adicionais")\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? (opcionalTemSelecao ? "Continuar" : "Sem adicional")\n        : "Continuar"\n'''
          )
          replace_once(manual, '    setEtapaVisivel(0)\n    // Sair da busca', '    setEtapaVisivel(0)\n    setOpcionaisAbertas(new Set())\n    // Sair da busca')
          replace_once(manual, '    setProdutoAberto(null)\n    setTermo("")\n    // Mesmo ciclo', '    setProdutoAberto(null)\n    setOpcionaisAbertas(new Set())\n    setTermo("")\n    // Mesmo ciclo')
          replace_once(
              manual,
              '''  function avancarEtapa() {\n    if (!etapaAtual || !etapaSatisfeita(etapaAtual, selecao)) return\n    if (etapaVisivel < etapas.length - 1) setEtapaVisivel(etapaVisivel + 1)\n  }\n\n  function voltarEtapa() {\n    // Recua uma etapa por vez sem tocar na seleção; na primeira, fecha o\n    // construtor. Nunca há um "voltar" que descarte escolhas silenciosamente.\n    if (etapaVisivel > 0) setEtapaVisivel(etapaVisivel - 1)\n    else setProdutoAberto(null)\n  }\n''',
              '''  function normalizarOpcionalSemEscolha(atual: SelecaoMontagem): SelecaoMontagem {\n    if (!etapaAtual || !etapaOpcional) return atual\n    if (etapaAtual.tipo === "borda" && !atual.borda) return { ...atual, borda: null }\n    if (etapaAtual.tipo === "adicionais" && (atual.adicionais?.length ?? 0) === 0) return { ...atual, adicionais: [] }\n    if (etapaAtual.tipo === "adicional_opcional" && !atual.adicionalOpcional) return { ...atual, adicionalOpcional: null }\n    return atual\n  }\n\n  function avancarEtapa() {\n    if (!etapaAtual || mostrarPerguntaOpcional || bloqueio) return\n    if (!etapaOpcional && !etapaSatisfeita(etapaAtual, selecao)) return\n    const selecaoFinal = etapaOpcional ? normalizarOpcionalSemEscolha(selecao) : selecao\n    if (selecaoFinal !== selecao) setSelecao(selecaoFinal)\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagemComSelecao(selecaoFinal)\n  }\n\n  function finalizarMontagemComSelecao(selecaoFinal: SelecaoMontagem) {\n    if (!produtoAberto || !montagemCompleta(etapas, selecaoFinal)) return\n    if (adicionandoRef.current) return\n    adicionandoRef.current = true\n    const item = construirItemManual(produtoAberto, selecaoFinal, menu)\n    if (item) setItens((atual) => adicionarAoCarrinho(atual, item))\n    setProdutoAberto(null)\n    setOpcionaisAbertas(new Set())\n    setTermo("")\n    setProdutoUiState("resumo")\n    window.setTimeout(() => { adicionandoRef.current = false }, 400)\n  }\n\n  function responderOpcional(quer: boolean) {\n    if (!etapaAtual || !etapaOpcional) return\n    if (quer) {\n      setOpcionaisAbertas((atuais) => {\n        const proximas = new Set(atuais)\n        proximas.add(etapaVisivel)\n        return proximas\n      })\n      return\n    }\n    const novaSelecao: SelecaoMontagem = etapaAtual.tipo === "borda"\n      ? { ...selecao, borda: null }\n      : etapaAtual.tipo === "adicionais"\n        ? { ...selecao, adicionais: [] }\n        : { ...selecao, adicionalOpcional: null }\n    setSelecao(novaSelecao)\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagemComSelecao(novaSelecao)\n  }\n\n  function voltarEtapa() {\n    if (etapaOpcional && opcionaisAbertas.has(etapaVisivel)) {\n      setOpcionaisAbertas((atuais) => {\n        const proximas = new Set(atuais)\n        proximas.delete(etapaVisivel)\n        return proximas\n      })\n      return\n    }\n    if (etapaVisivel > 0) setEtapaVisivel(etapaVisivel - 1)\n    else setProdutoAberto(null)\n  }\n'''
          )
          replace_once(
              manual,
              '''    } else if (etapaAtual.tipo === "borda") {\n      setSelecao((s) => ({ ...s, borda: valor === "" ? null : valor }))\n    } else if (etapaAtual.tipo === "tamanho_item") {''',
              '''    } else if (etapaAtual.tipo === "borda") {\n      setSelecao((s) => ({ ...s, borda: s.borda === valor ? null : (valor || null) }))\n    } else if (etapaAtual.tipo === "adicionais") {\n      setSelecao((s) => alternarAdicional(s, valor))\n    } else if (etapaAtual.tipo === "adicional_opcional") {\n      setSelecao((s) => ({ ...s, adicionalOpcional: s.adicionalOpcional === valor ? null : (valor || null) }))\n    } else if (etapaAtual.tipo === "tamanho_item") {'''
          )
          replace_once(
              manual,
              '''      case "borda":\n        return valor === "" ? selecao.borda === null : selecao.borda === valor\n      case "tamanho_item":''',
              '''      case "borda":\n        return valor === "" ? selecao.borda === null : selecao.borda === valor\n      case "adicionais":\n        return selecao.adicionais?.includes(valor) ?? false\n      case "adicional_opcional":\n        return selecao.adicionalOpcional === valor\n      case "tamanho_item":'''
          )
          replace_once(manual, '<IconeProduto size={18} aria-hidden="true" style={{ color: "var(--foreground-muted)", flexShrink: 0 }} />', '<span aria-hidden="true" style={{ fontSize: 20, flexShrink: 0 }}>{EMOJI_CATEGORIA[p.categoria]}</span>\n                      <IconeProduto size={18} aria-hidden="true" style={{ color: "var(--foreground-muted)", flexShrink: 0 }} />')
          replace_once(manual, '{etapaAtual.ajuda}</p>', '{ajudaEtapa}</p>')
          replace_once(
              manual,
              '            {etapaTemBusca && (\n',
              '''            {mostrarPerguntaOpcional && (\n              <div style={{ padding: "18px 22px 0", flexShrink: 0 }}>\n                <div style={{ ...card, display: "grid", gap: 14, textAlign: "center" }}>\n                  <p style={{ margin: 0, fontSize: 19, fontWeight: 900, color: "var(--foreground)" }}>{perguntaOpcional}</p>\n                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>\n                    <button onClick={() => responderOpcional(true)} style={btnPrimary}>Sim</button>\n                    <button onClick={() => responderOpcional(false)} style={btnSecondary}>Não</button>\n                  </div>\n                </div>\n              </div>\n            )}\n\n            {etapaTemBusca && (\n'''
          )
          replace_once(manual, '                        {o.label}\n                        {o.esgotado ? " · esgotado" : ""}', '                        {emojiOpcaoMontagemManual(etapaAtual.tipo, produtoAberto.categoria)} {o.label}\n                        {o.esgotado ? " · esgotado" : ""}')
          replace_once(manual, '              {bloqueio && (', '              {!mostrarPerguntaOpcional && bloqueio && (')
          replace_once(
              manual,
              '                {indiceEtapaPendente(etapas, selecao) === -1 ? (',
              '                {!mostrarPerguntaOpcional && (!etapaOpcional && indiceEtapaPendente(etapas, selecao) === -1 ? ('
          )
          replace_once(
              manual,
              '''                  </button>\n                )}\n              </div>\n''',
              '''                  </button>\n                ))}\n              </div>\n'''
          )
          replace_once(
              manual,
              '{etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Continuar"} <ArrowRight size={16} aria-hidden="true" />',
              '{etapaOpcional ? rotuloCtaOpcional : etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Continuar"} <ArrowRight size={16} aria-hidden="true" />'
          )

          # Tests estruturais do pedido manual: Sim/Não, CTA reversível e emojis.
          manual_test = "src/app/pedidos/NovoPedidoManual.etapas.test.ts"
          replace_once(
              manual_test,
              '  test("radio para escolha única (borda, tamanho, leite, sabor único); checkbox só para sabores de pizza (até 2)", () => {\n    expect(fonte).toContain(\'const tipoControleEtapa: "radio" | "checkbox" = etapaAtual?.tipo === "sabores" ? "checkbox" : "radio"\');',
