          replace_once(publico, '    setMacarronadaSizeEscolhido(null);\n    go("sc-another");', '    setMacarronadaSizeEscolhido(null);\n    setMacarronadaAddOnEscolhido(null);\n    go("sc-another");')

          sub_once(
