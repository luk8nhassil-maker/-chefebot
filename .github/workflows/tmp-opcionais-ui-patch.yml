er)" }}>Esgotado</div>}</div><div className="opt-price">{esg ? "" : `+${money(o.price)}`}</div><div className="opt-check" />\n                  </div>\n                );\n              })}\n              <div className="build-foot">\n                <div className="build-foot-hint">{macarronadaAddOnEscolhido ? `Adicional: ${macarronadaAddOnEscolhido}` : "Nenhum adicional selecionado"}</div>\n                <button className="btn" onClick={() => finalizarMacarronada(macarronadaSizeEscolhido, macarronadaAddOnEscolhido ?? undefined)}>{macarronadaAddOnEscolhido ? "Continuar" : "Sem adicional"}</button>\n              </div>\n            </section>\n          )}          {screen === "sc-delivery" && ('''
