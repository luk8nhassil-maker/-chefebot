name: tmp-salao-concluir-envio-patch

on:
  push:
    branches:
      - feat/salao-concluir-envio
    paths:
      - .github/workflows/tmp-salao-concluir-envio-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: feat/salao-concluir-envio
          fetch-depth: 0

      - name: Aplicar patch mínimo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/salao/page.tsx')
          text = page.read_text()

          substituicoes = [
            (
              '''  onVerPedidosAbertos,\n  onAdicionarMaisItens,\n}: {\n  comanda: Comanda | null\n  rotulo: string\n  pedidoNumero: number | undefined\n  total: number\n  onVerPedidosAbertos: () => void\n  onAdicionarMaisItens: () => void\n}) {''',
              '''  onConcluir,\n  onVerPedidosAbertos,\n  onAdicionarMaisItens,\n}: {\n  comanda: Comanda | null\n  rotulo: string\n  pedidoNumero: number | undefined\n  total: number\n  onConcluir: () => void\n  onVerPedidosAbertos: () => void\n  onAdicionarMaisItens: () => void\n}) {''',
            ),
            (
              '''        <button onClick={onVerPedidosAbertos} style={btnPrimario}>Ver pedidos abertos</button>\n        <button onClick={adicionarMaisItens} disabled={processando} style={{ ...btnSecundario, ...(processando ? btnDesabilitado : {}) }}>\n          {processando ? "Abrindo…" : "Adicionar mais itens"}\n        </button>''',
              '''        <button onClick={onConcluir} style={btnPrimario}>Concluir</button>\n        <button onClick={onVerPedidosAbertos} style={btnSecundario}>Ver pedidos abertos</button>\n        <button onClick={adicionarMaisItens} disabled={processando} style={{ ...btnSecundario, ...(processando ? btnDesabilitado : {}) }}>\n          {processando ? "Abrindo…" : "Adicionar mais itens"}\n        </button>''',
            ),
            (
              '''        total={tela.total}\n        onVerPedidosAbertos={() => { setAba("abertos"); voltarParaInicio() }}''',
              '''        total={tela.total}\n        onConcluir={() => { setAba("pedido"); voltarParaInicio() }}\n        onVerPedidosAbertos={() => { setAba("abertos"); voltarParaInicio() }}''',
            ),
          ]
          for antigo, novo in substituicoes:
              if antigo not in text:
                  raise SystemExit('trecho esperado não encontrado no page.tsx')
              text = text.replace(antigo, novo, 1)
          page.write_text(text)

          test = Path('src/app/salao/page.test.tsx')
          t = test.read_text()
          antigo = '''    expect(screen.getByRole("button", { name: "Ver pedidos abertos" })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Adicionar mais itens" })).toBeInTheDocument();\n  });'''
          novo = '''    const concluir = screen.getByRole("button", { name: "Concluir" });\n    const verAbertos = screen.getByRole("button", { name: "Ver pedidos abertos" });\n    const adicionarMais = screen.getByRole("button", { name: "Adicionar mais itens" });\n    expect(concluir).toBeInTheDocument();\n    expect(verAbertos).toBeInTheDocument();\n    expect(adicionarMais).toBeInTheDocument();\n\n    const acoes = [concluir, verAbertos, adicionarMais];\n    expect(acoes.map((botao) => botao.textContent)).toEqual(["Concluir", "Ver pedidos abertos", "Adicionar mais itens"]);\n\n    await user.click(concluir);\n    expect(await screen.findByText("Novo atendimento")).toBeInTheDocument();\n    expect(screen.queryByText("Pedido enviado para a cozinha")).not.toBeInTheDocument();\n  });'''
          if antigo not in t:
              raise SystemExit('trecho esperado não encontrado no teste')
          test.write_text(t.replace(antigo, novo, 1))
          PY

      - name: Commitar patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/salao/page.tsx src/app/salao/page.test.tsx
          git diff --cached --check
          git commit -m "feat(salao): adiciona concluir após envio"
          git push origin HEAD:feat/salao-concluir-envio
