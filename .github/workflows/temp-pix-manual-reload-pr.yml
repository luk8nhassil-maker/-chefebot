name: temp-pix-manual-reload-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  corrigir-e-validar:
    if: github.event.pull_request.head.ref == 'fix/pedidos-pix-manual-reload-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Provar a regressão antes do patch
        shell: bash
        run: |
          set +e
          npx vitest run src/app/pedidos/pixManualReload.regression.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "O teste passou antes do patch; abortando para não alterar código sem reproduzir o defeito."
            exit 1
          fi
          echo "Regressão reproduzida: a confirmação manual não recarrega o painel."

      - name: Aplicar patch mínimo
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/app/pedidos/page.tsx")
          fonte = path.read_text(encoding="utf-8")
          antigo = """        setPixConfirmando(false)
        resetarVerificacaoPix()
        return"""
          novo = """        setPixConfirmando(false)
        resetarVerificacaoPix()
        // O pagamento já foi persistido. Recarrega o painel como um F5 para
        // reidratar a lista canônica sem repetir nem alterar a confirmação Pix.
        window.location.reload()
        return"""
          if fonte.count(antigo) != 1:
              raise SystemExit(f"Bloco alvo encontrado {fonte.count(antigo)} vez(es); patch abortado.")
          path.write_text(fonte.replace(antigo, novo, 1), encoding="utf-8")

      - name: Testes focados
        run: |
          npx vitest run \
            src/app/pedidos/pixManualReload.regression.test.ts \
            src/app/pedidos/pixModalFechamento.regression.test.ts \
            src/app/pedidos/pixSeguranca.page.test.ts \
            src/app/pedidos/page.test.ts

      - name: Lint do patch
        run: npx eslint src/app/pedidos/page.tsx src/app/pedidos/pixManualReload.regression.test.ts

      - name: Comparar TypeScript com a main base
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/branch-tsc.txt 2>&1
          set -e
          git worktree add --detach /tmp/chefebot-main 13c3079293468460172bd29821b297fe60c3429e
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chefebot-main/node_modules
          cd /tmp/chefebot-main
          set +e
          npx tsc --noEmit --pretty false > /tmp/main-tsc.txt 2>&1
          set -e
          cd "$GITHUB_WORKSPACE"
          branch_errors=$(grep -c 'error TS[0-9]' /tmp/branch-tsc.txt || true)
          main_errors=$(grep -c 'error TS[0-9]' /tmp/main-tsc.txt || true)
          echo "main erros TS: $main_errors"
          echo "branch erros TS: $branch_errors"
          test "$branch_errors" -le "$main_errors"

      - name: Build de produção
        run: npm run build

      - name: Conferir diff e remover executores temporários
        shell: bash
        run: |
          git diff --check
          git diff -- src/app/pedidos/page.tsx src/app/pedidos/pixManualReload.regression.test.ts
          git rm .github/workflows/temp-pix-manual-reload.yml .github/workflows/temp-pix-manual-reload-pr.yml

      - name: Persistir patch validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pedidos/page.tsx .github/workflows/temp-pix-manual-reload.yml .github/workflows/temp-pix-manual-reload-pr.yml
          git commit -m "fix(pedidos): recarrega painel após confirmar Pix manual"
          git push origin HEAD:fix/pedidos-pix-manual-reload-20260822
