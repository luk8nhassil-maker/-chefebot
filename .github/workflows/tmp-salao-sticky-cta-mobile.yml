name: tmp-salao-sticky-cta-mobile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-salao-sticky-cta-mobile.yml
      - scripts/tmp_salao_sticky_cta_patch.py

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/salao-sticky-cta-mobile-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Provar defeito antes do patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_salao_sticky_cta_patch.py tests
          set +e
          npx vitest run src/app/salao/page.test.tsx -t "mantém o CTA principal visível no rodapé mobile e com contraste escuro suave" > /tmp/prepatch.log 2>&1
          pre=$?
          set -e
          cat /tmp/prepatch.log
          if [ "$pre" -eq 0 ]; then
            echo "::error::O teste de UX passou antes da correção; prova de regressão inválida."
            exit 1
          fi
          grep -Eq "sal-action-footer|#374151|expected|toHaveStyle" /tmp/prepatch.log || {
            echo "::error::A falha pré-patch não corresponde ao defeito de rodapé/contraste esperado."
            exit 1
          }

      - name: Aplicar patch mínimo
        run: python scripts/tmp_salao_sticky_cta_patch.py page

      - name: Validar Salão completo
        run: npx vitest run src/app/salao/page.test.tsx

      - name: Lint dos arquivos alterados
        run: npx eslint src/app/salao/page.tsx src/app/salao/page.test.tsx

      - name: Build de produção
        run: npm run build

      - name: Publicar somente o patch validado
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-salao-sticky-cta-mobile.yml scripts/tmp_salao_sticky_cta_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(salao): fixa CTAs do fluxo no mobile"
          git push origin HEAD:fix/salao-sticky-cta-mobile-20260820
