name: whatsapp-link-cardapio-ci

# Gate hermético para impedir que links/webhooks legados do ChefeBot
# alcancem clientes pelo WhatsApp. Não recebe segredos e não chama Evolution real.
on:
  pull_request:
    paths:
      - "src/lib/whatsappMensagem.ts"
      - "src/lib/whatsappMensagem.test.ts"
      - "src/lib/evolutionApi.ts"
      - "src/lib/evolutionApi.test.ts"
      - "src/app/api/whatsapp/reset/route.ts"
      - "src/app/api/whatsapp/reset/route.test.ts"
      - ".github/workflows/whatsapp-link-cardapio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-link-cardapio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  whatsapp-link-cardapio-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do SHA validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Instalar dependências
        run: npm ci

      - name: Testar link e webhook oficiais do WhatsApp
        run: npm test -- src/lib/whatsappMensagem.test.ts src/lib/evolutionApi.test.ts src/app/api/whatsapp/reset/route.test.ts

      - name: Lint dos arquivos alterados
        run: npm run lint -- src/lib/whatsappMensagem.ts src/lib/whatsappMensagem.test.ts src/lib/evolutionApi.ts src/lib/evolutionApi.test.ts src/app/api/whatsapp/reset/route.ts src/app/api/whatsapp/reset/route.test.ts
