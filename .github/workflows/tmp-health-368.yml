name: tmp-health-368

on:
  push:
    branches:
      - fix/salao-remove-legendas-detalhe-20260820
  pull_request:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check somente leitura
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://chefedapizza.com.br/" \
            "https://chefedapizza.com.br/salao" \
            "https://chefedapizza.com.br/api/cardapio"; do
            code=$(curl -sS -L --max-time 25 -o /tmp/body -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
            test "$code" = "200"
            test -s /tmp/body
          done
          echo "Health check pós-deploy concluído sem escrita."
