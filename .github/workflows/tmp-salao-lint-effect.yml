name: tmp-salao-lint-effect

on:
  push:
    branches:
      - feat/salao-receber-pagamento-terminal
    paths:
      - .github/workflows/tmp-salao-lint-effect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/salao-receber-pagamento-terminal
      - name: Ajustar carregamento inicial
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/salao/receber/[id]/page.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {\n    void carregar()\n  }, [carregar])'''
          new = '''  useEffect(() => {\n    (async () => { await carregar() })()\n  }, [carregar])'''
          if text.count(old) != 1:
            raise SystemExit(f'Esperava 1 bloco de efeito, encontrei {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- 'src/app/salao/receber/[id]/page.tsx'
      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/salao/receber/[id]/page.tsx'
          git commit -m "fix(salao): ajusta carregamento inicial do recebimento"
          git push origin HEAD:feat/salao-receber-pagamento-terminal
