name: tmp-health-salao-opcionais-20260820

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-health-salao-opcionais-20260820.yml

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health check somente leitura
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            url="$1"
            code="$(curl -sS -L -o /tmp/health-body -w '%{http_code}' "$url")"
            echo "$url -> HTTP $code"
            test "$code" = "200"
          }

          check_200 "https://chefedapizza.com.br/salao"
          check_200 "https://chefedapizza.com.br/pedidos"

          code="$(curl -sS -o /tmp/comandas-body -w '%{http_code}' 'https://chefedapizza.com.br/api/salao/comandas')"
          echo "https://chefedapizza.com.br/api/salao/comandas (sem sessão) -> HTTP $code"
          test "$code" = "401"
          grep -q 'Não autorizado' /tmp/comandas-body
