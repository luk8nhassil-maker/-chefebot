name: pedidos-operacional-ci

on:
  pull_request:
    paths:
      - "src/lib/expedienteOperacional.ts"
      - "src/lib/expedienteOperacional.test.ts"
      - "src/lib/pedidosPainelOperacional.ts"
      - "src/lib/pedidosPainelOperacional.test.ts"
      - "src/lib/limpezaOperacionalPedidos.ts"
      - "src/lib/limpezaOperacionalPedidos.test.ts"
      - "src/components/LimpezaOperacionalPainel.tsx"
      - "src/components/LimpezaOperacionalPainel.contrato.test.ts"
      - "src/app/api/orders-painel/route.ts"
      - "src/app/api/cron/route.ts"
      - "src/lib/numeracao.ts"
      - "src/middleware.ts"
      - ".github/workflows/pedidos-operacional-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pedidos-operacional-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-pix-modal-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/pedidos-pix-modal-stuck-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Instalar dependências
        run: npm ci

      - name: Normalizar somente a indentação do helper já validado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/app/pedidos/page.tsx")
          src = p.read_text()
          inicio = src.find("  function resetarVerificacaoPix() {")
          fim = src.find("  const checklistCompleto", inicio)
          if inicio < 0 or fim < 0:
              raise SystemExit("Bloco Pix já corrigido não encontrado")
          atual = src[inicio:fim]
          if "resetarVerificacaoPix()" not in atual or "if (pixConfirmando) return" not in atual:
              raise SystemExit("Bloco Pix não corresponde ao patch validado")
          limpo = (
              "  function resetarVerificacaoPix() {\n"
              "    setConfirmPixModal(null)\n"
              "    setPixChecklist({ conferiu: false, valorBate: false, clienteCorreto: false })\n"
              "    setPixSenha(\"\")\n"
              "    setPixSenhaVisivel(false)\n"
              "    setPixErro(null)\n"
              "  }\n"
              "  function fecharVerificacaoPix() {\n"
              "    if (pixConfirmando) return\n"
              "    resetarVerificacaoPix()\n"
              "  }\n"
          )
          p.write_text(src[:inicio] + limpo + src[fim:])
          PY

      - name: Testes focados do Pix manual e do painel
        run: >-
          npm test --
          src/app/pedidos/pixModalFechamento.regression.test.ts
          src/app/pedidos/pixSeguranca.page.test.ts
          src/app/api/orders/confirmar-pix-manual/route.test.ts

      - name: Lint do patch
        run: >-
          npm run lint --
          src/app/pedidos/page.tsx
          src/app/pedidos/pixSeguranca.page.test.ts
          src/app/pedidos/pixModalFechamento.regression.test.ts

      - name: Build de produção
        run: npm run build

      - name: Restaurar CI original e gravar limpeza validada
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/pedidos-operacional-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pedidos/page.tsx .github/workflows/pedidos-operacional-ci.yml
          git commit -m "style(pedidos): mantém helper do modal Pix legível"
          git push origin HEAD:fix/pedidos-pix-modal-stuck-20260821

  pedidos-operacional-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/pedidos-pix-modal-stuck-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do SHA validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados do expediente e cobrança operacional
        run: >-
          npm test --
          src/lib/expedienteOperacional.test.ts
          src/lib/pedidosPainelOperacional.test.ts
          src/lib/limpezaOperacionalPedidos.test.ts
          src/components/LimpezaOperacionalPainel.contrato.test.ts

      - name: Lint dos arquivos da mudança
        run: >-
          npm run lint --
          src/lib/expedienteOperacional.ts
          src/lib/expedienteOperacional.test.ts
          src/lib/pedidosPainelOperacional.ts
          src/lib/pedidosPainelOperacional.test.ts
          src/lib/limpezaOperacionalPedidos.ts
          src/lib/limpezaOperacionalPedidos.test.ts
          src/components/LimpezaOperacionalPainel.tsx
          src/components/LimpezaOperacionalPainel.contrato.test.ts
          src/app/api/orders-painel/route.ts
          src/app/api/cron/route.ts
          src/lib/numeracao.ts
          src/middleware.ts
