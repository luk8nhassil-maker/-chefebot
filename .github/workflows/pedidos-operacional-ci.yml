name: pedidos-operacional-ci

# Executor temporário desta branch: aplica o patch determinístico somente no
# head do PR, valida regras puras e grava o resultado na própria branch.
# Será removido antes do merge e o gate normal será restaurado.
on:
  pull_request:
    paths:
      - "scripts/aplicar-na-rua-20min.py"
      - ".github/workflows/pedidos-operacional-ci.yml"
      - "src/lib/limpezaOperacionalPedidos.ts"
      - "src/lib/limpezaOperacionalPedidos.test.ts"
      - "src/app/pedidos/page.tsx"
      - "src/app/pedidos/page.test.ts"

permissions:
  contents: write

concurrency:
  group: pedidos-aplica-na-rua-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true

      - name: Aplicar patch determinístico
        run: python scripts/aplicar-na-rua-20min.py

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados
        run: npm test -- src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.test.ts

      - name: Lint focado nas regras e no teste estrutural
        run: npm run lint -- src/lib/limpezaOperacionalPedidos.ts src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.test.ts

      - name: Verificar e gravar patch na branch
        shell: bash
        run: |
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/limpezaOperacionalPedidos.ts src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.tsx src/app/pedidos/page.test.ts
          git commit -m "fix(pedidos): cronometro individual de 20 min na rua"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
