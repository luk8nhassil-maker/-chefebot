name: pedidos-operacional-ci

# Gate hermético da regra operacional de pedidos. Não recebe segredos, não
# acessa Redis/WhatsApp/Pix/impressão reais e executa apenas código/testes locais.
on:
  pull_request:
    paths:
      - "src/lib/expedienteOperacional.ts"
      - "src/lib/expedienteOperacional.test.ts"
      - "src/lib/pedidosPainelOperacional.ts"
      - "src/lib/pedidosPainelOperacional.test.ts"
      - "src/lib/limpezaOperacionalPedidos.ts"
      - "src/lib/limpezaOperacionalPedidos.test.ts"
      - "src/lib/pollingVisivel.ts"
      - "src/lib/pollingVisivel.test.ts"
      - "src/components/LimpezaOperacionalPainel.tsx"
      - "src/components/LimpezaOperacionalPainel.contrato.test.ts"
      - "src/app/pedidos/page.tsx"
      - "src/app/pedidos/pollingEconomia.page.test.ts"
      - "src/app/api/orders/route.ts"
      - "src/app/api/orders/route.economia.test.ts"
      - "src/app/api/orders-painel/route.ts"
      - "src/app/api/cron/route.ts"
      - "src/lib/numeracao.ts"
      - "src/middleware.ts"
      - ".github/workflows/pedidos-operacional-ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pedidos-operacional-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  economia-polling-redis:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'perf/economia-polling-redis-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Instalar dependências
        run: npm ci

      - name: Criar contratos de regressão antes do patch
        shell: bash
        run: |
          cat > src/app/pedidos/pollingEconomia.page.test.ts <<'EOF'
          import { describe, expect, test } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";

          const fonte = readFileSync(fileURLToPath(new URL("./page.tsx", import.meta.url)), "utf-8");

          describe("/pedidos — economia sem perder responsividade", () => {
            test("usa scheduler sem sobreposição para pedidos, preservando polling em segundo plano para alertas", () => {
              expect(fonte).toContain('import { iniciarPollingVisivel } from "@/lib/pollingVisivel"');
              expect(fonte).toContain("executar: carregarPedidos");
              expect(fonte).toContain("intervaloMs: 3000");
              expect(fonte).toContain("pausarOculto: false");
              expect(fonte).not.toContain("setInterval(carregarPedidos, 3000)");
              expect(fonte).not.toContain("setTimeout(carregarPedidos, 3000)");
            });

            test("sessoes e historico param quando a aba fica oculta e retomam sem mudar os 3s visiveis", () => {
              const usosPausa = fonte.match(/pausarOculto: true/g) ?? [];
              expect(usosPausa.length).toBeGreaterThanOrEqual(2);
              expect(fonte).not.toContain("setInterval(carregarSessoes, 3000)");
              expect(fonte).not.toContain("setInterval(() => carregarHistoricoConversa(sessaoAtiva), 3000)");
            });
          });
          EOF

          cat > src/app/api/orders/route.economia.test.ts <<'EOF'
          import { describe, expect, test } from "vitest";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";

          const fonte = readFileSync(fileURLToPath(new URL("./route.ts", import.meta.url)), "utf-8");
          const getRoute = fonte.slice(fonte.indexOf("export async function GET"), fonte.indexOf("type ResultadoAplicarStatus"));

          describe("GET /api/orders — leitura econômica com escrita protegida", () => {
            test("faz leitura direta primeiro e só entra no mutex quando há limpeza real a persistir", () => {
              expect(getRoute).toContain("const snapshotPedidos = (await redis.get<Pedido[]>('pedidos')) || []");
              expect(getRoute).toContain("const limpezaInicial = limparPedidosExpirados(snapshotPedidos)");
              expect(getRoute).toContain("if (limpezaInicial.mudou)");
              expect(getRoute).toContain("mutarPedidos<Pedido, Pedido[]>");
            });

            test("não remove o mutex do caminho de escrita da limpeza preguiçosa", () => {
              expect(getRoute).toContain("persistir: true");
              expect(getRoute).toContain("pedidos: limpezaAtual.pedidos");
            });
          });
          EOF

      - name: Provar que o desperdício existe antes do patch
        shell: bash
        run: |
          set +e
          npm test -- src/app/pedidos/pollingEconomia.page.test.ts src/app/api/orders/route.economia.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Os contratos de economia já passavam antes do patch; abortando para não alterar sem reprodução."
            exit 1
          fi
          echo "Desperdício reproduzido: contratos falharam no código atual, como esperado."

      - name: Aplicar patch mínimo de economia
        shell: bash
        run: |
          cat > src/lib/pollingVisivel.ts <<'EOF'
          type DocumentoPolling = {
            hidden: boolean;
            addEventListener: (type: "visibilitychange", listener: () => void) => void;
            removeEventListener: (type: "visibilitychange", listener: () => void) => void;
          };

          type AmbientePolling = {
            documento?: DocumentoPolling | null;
            agora?: () => number;
            setTimeoutFn?: (callback: () => void, delayMs: number) => ReturnType<typeof setTimeout>;
            clearTimeoutFn?: (id: ReturnType<typeof setTimeout>) => void;
          };

          export type OpcoesPollingVisivel = {
            executar: () => void | Promise<void>;
            intervaloMs: number;
            pausarOculto?: boolean;
            executarAoIniciar?: boolean;
            ambiente?: AmbientePolling;
          };

          /**
           * Polling sem sobreposição: o próximo disparo só é armado quando o
           * anterior termina. O intervalo é medido a partir do INÍCIO da chamada,
           * então requisições rápidas preservam a mesma cadência nominal (ex.: 3s)
           * e requisições lentas nunca empilham concorrência.
           *
           * Quando `pausarOculto` é true, uma aba invisível não gera tráfego e a
           * volta ao foreground dispara uma atualização imediata. Para fluxos que
           * também funcionam como alarme de pedido, use false para preservar a
           * cobertura em segundo plano.
           */
          export function iniciarPollingVisivel(opcoes: OpcoesPollingVisivel): () => void {
            if (!Number.isFinite(opcoes.intervaloMs) || opcoes.intervaloMs <= 0) {
              throw new Error("intervaloMs deve ser maior que zero");
            }

            const documento = opcoes.ambiente?.documento ??
              (typeof document !== "undefined" ? document : null);
            const agora = opcoes.ambiente?.agora ?? Date.now;
            const setTimeoutFn = opcoes.ambiente?.setTimeoutFn ?? setTimeout;
            const clearTimeoutFn = opcoes.ambiente?.clearTimeoutFn ?? clearTimeout;
            const pausarOculto = opcoes.pausarOculto ?? true;
            const executarAoIniciar = opcoes.executarAoIniciar ?? true;

            let cancelado = false;
            let emExecucao = false;
            let timer: ReturnType<typeof setTimeout> | null = null;

            const limparTimer = () => {
              if (timer !== null) {
                clearTimeoutFn(timer);
                timer = null;
              }
            };

            const estaOculto = () => pausarOculto && documento?.hidden === true;

            const agendar = (delayMs: number = opcoes.intervaloMs) => {
              if (cancelado || estaOculto()) return;
              limparTimer();
              timer = setTimeoutFn(() => { void rodar(); }, Math.max(0, delayMs));
            };

            const rodar = async () => {
              if (cancelado || estaOculto() || emExecucao) return;
              limparTimer();
              emExecucao = true;
              const iniciouEm = agora();
              try {
                await opcoes.executar();
              } catch {
                // O chamador continua responsável pelo estado de erro. Uma falha
                // transitória não mata o polling nem cria retry agressivo.
              } finally {
                emExecucao = false;
                if (cancelado || estaOculto()) return;
                const duracao = Math.max(0, agora() - iniciouEm);
                agendar(Math.max(0, opcoes.intervaloMs - duracao));
              }
            };

            const aoMudarVisibilidade = () => {
              if (!pausarOculto) return;
              if (estaOculto()) {
                limparTimer();
                return;
              }
              if (!emExecucao) void rodar();
            };

            if (pausarOculto && documento) {
              documento.addEventListener("visibilitychange", aoMudarVisibilidade);
            }

            if (executarAoIniciar) {
              if (!estaOculto()) void rodar();
            } else {
              agendar();
            }

            return () => {
              cancelado = true;
              limparTimer();
              if (pausarOculto && documento) {
                documento.removeEventListener("visibilitychange", aoMudarVisibilidade);
              }
            };
          }
          EOF

          cat > src/lib/pollingVisivel.test.ts <<'EOF'
          import { afterEach, beforeEach, describe, expect, test, vi } from "vitest";
          import { iniciarPollingVisivel } from "./pollingVisivel";

          class DocumentoFake {
            hidden = false;
            private listeners = new Set<() => void>();
            addEventListener(_type: "visibilitychange", listener: () => void) { this.listeners.add(listener); }
            removeEventListener(_type: "visibilitychange", listener: () => void) { this.listeners.delete(listener); }
            mudar(hidden: boolean) {
              this.hidden = hidden;
              for (const listener of this.listeners) listener();
            }
          }

          beforeEach(() => vi.useFakeTimers());
          afterEach(() => vi.useRealTimers());

          describe("iniciarPollingVisivel", () => {
            test("mantém a cadência nominal medida pelo início quando a chamada é rápida", async () => {
              const doc = new DocumentoFake();
              const executar = vi.fn(async () => {});
              const parar = iniciarPollingVisivel({
                executar,
                intervaloMs: 3000,
                pausarOculto: true,
                ambiente: { documento: doc },
              });

              await vi.runAllTicks();
              expect(executar).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(2999);
              expect(executar).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(1);
              expect(executar).toHaveBeenCalledTimes(2);
              parar();
            });

            test("nunca sobrepõe requisições lentas e roda de novo assim que a anterior libera", async () => {
              const doc = new DocumentoFake();
              let resolver!: () => void;
              const pendente = new Promise<void>(resolve => { resolver = resolve; });
              const executar = vi.fn().mockImplementationOnce(() => pendente).mockResolvedValue(undefined);
              const parar = iniciarPollingVisivel({ executar, intervaloMs: 3000, pausarOculto: false, ambiente: { documento: doc } });

              await vi.runAllTicks();
              expect(executar).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(9000);
              expect(executar).toHaveBeenCalledTimes(1);
              resolver();
              await Promise.resolve();
              await Promise.resolve();
              await vi.advanceTimersByTimeAsync(0);
              expect(executar).toHaveBeenCalledTimes(2);
              parar();
            });

            test("aba oculta zera tráfego secundário e voltar ao foreground atualiza imediatamente", async () => {
              const doc = new DocumentoFake();
              const executar = vi.fn(async () => {});
              const parar = iniciarPollingVisivel({ executar, intervaloMs: 3000, pausarOculto: true, ambiente: { documento: doc } });

              await vi.runAllTicks();
              expect(executar).toHaveBeenCalledTimes(1);
              doc.mudar(true);
              await vi.advanceTimersByTimeAsync(30000);
              expect(executar).toHaveBeenCalledTimes(1);
              doc.mudar(false);
              await vi.runAllTicks();
              expect(executar).toHaveBeenCalledTimes(2);
              parar();
            });

            test("polling crítico pode continuar em segundo plano quando pausarOculto=false", async () => {
              const doc = new DocumentoFake();
              doc.hidden = true;
              const executar = vi.fn(async () => {});
              const parar = iniciarPollingVisivel({ executar, intervaloMs: 3000, pausarOculto: false, ambiente: { documento: doc } });

              await vi.runAllTicks();
              expect(executar).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(3000);
              expect(executar).toHaveBeenCalledTimes(2);
              parar();
            });

            test("cleanup cancela timer e listener", async () => {
              const doc = new DocumentoFake();
              const executar = vi.fn(async () => {});
              const parar = iniciarPollingVisivel({ executar, intervaloMs: 3000, pausarOculto: true, ambiente: { documento: doc } });
              await vi.runAllTicks();
              parar();
              doc.mudar(true);
              doc.mudar(false);
              await vi.advanceTimersByTimeAsync(10000);
              expect(executar).toHaveBeenCalledTimes(1);
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          page = Path("src/app/pedidos/page.tsx")
          src = page.read_text()

          replacements = [
              (
                  'import { mapearFamiliasVisiveis, selecionarPedidosPainel, selecionarProximaAcaoFamilia } from "@/lib/pedidoComandaPainel"\n',
                  'import { mapearFamiliasVisiveis, selecionarPedidosPainel, selecionarProximaAcaoFamilia } from "@/lib/pedidoComandaPainel"\nimport { iniciarPollingVisivel } from "@/lib/pollingVisivel"\n',
                  "import polling",
              ),
              ('  const carregarPedidos = () => {\n    fetch("/api/orders")', '  const carregarPedidos = () => {\n    return fetch("/api/orders")', "return carregarPedidos"),
              ('.catch(() => setTimeout(carregarPedidos, 3000))', '.catch(() => {})', "retry duplicado carregarPedidos"),
              ('    carregarPedidos(); carregarStatusBot()\n', '    carregarStatusBot()\n', "chamada inicial duplicada pedidos"),
              ('    const intervalo = setInterval(carregarPedidos, 3000)\n', '    const pararPollingPedidos = iniciarPollingVisivel({ executar: carregarPedidos, intervaloMs: 3000, pausarOculto: false })\n', "interval pedidos"),
              ('clearInterval(intervalo); clearInterval(tick);', 'pararPollingPedidos(); clearInterval(tick);', "cleanup pedidos"),
              ('    const carregarSessoes = () => {\n      fetch(`/api/sessoes-ativas?t=${Date.now()}`, { cache: "no-store" })', '    const carregarSessoes = () => {\n      return fetch(`/api/sessoes-ativas?t=${Date.now()}`, { cache: "no-store" })', "return sessoes"),
              ('    carregarSessoes()\n    const iv = setInterval(carregarSessoes, 3000)\n    return () => clearInterval(iv)', '    return iniciarPollingVisivel({ executar: carregarSessoes, intervaloMs: 3000, pausarOculto: true })', "polling sessoes"),
              ('    carregarHistoricoConversa(sessaoAtiva)\n    const iv = setInterval(() => carregarHistoricoConversa(sessaoAtiva), 3000)\n    return () => clearInterval(iv)', '    return iniciarPollingVisivel({ executar: () => carregarHistoricoConversa(sessaoAtiva), intervaloMs: 3000, pausarOculto: true })', "polling historico"),
          ]

          for old, new, label in replacements:
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: esperado 1 alvo, encontrado {count}")
              src = src.replace(old, new, 1)
          page.write_text(src)

          route = Path("src/app/api/orders/route.ts")
          r = route.read_text()

          marker = "export async function GET(req: NextRequest) {"
          helper = '''function limparPedidosExpirados(pedidos: Pedido[], agora: number = Date.now()): { pedidos: Pedido[]; mudou: boolean } {
            let mudou = false
            const limpos = pedidos.map(p => {
              const edicao = limparEdicaoExpiradaSeNecessario(p, agora)
              const escalonamento = limparEscalonamentoExpiradoSeNecessario(edicao.pedido, agora)
              if (edicao.mudou || escalonamento.mudou) mudou = true
              return escalonamento.pedido as Pedido
            })
            return { pedidos: limpos, mudou }
          }

          '''
          if r.count(marker) != 1:
              raise SystemExit("GET /api/orders não encontrado de forma única")
          r = r.replace(marker, helper + marker, 1)

          start = r.index("  // Limpeza preguiçosa de locks de edição expirados")
          end = r.index("\n  // Enriquecimento SOMENTE de leitura", start)
          old_block = r[start:end]
          if "const limpos = await mutarPedidos" not in old_block:
              raise SystemExit("Bloco antigo da limpeza GET não corresponde ao esperado")

          new_block = '''  // Caminho quente do painel: leitura é barata e NÃO disputa o mutex global.
            // Só promovemos a requisição para leitura-modificação-escrita quando o
            // snapshot realmente contém edição/escalonamento expirado. Nesse caso,
            // relê FRESCO dentro de mutarPedidos antes de persistir — a garantia contra
            // lost update continua exatamente no ponto em que existe escrita.
            const snapshotPedidos = (await redis.get<Pedido[]>('pedidos')) || []
            const limpezaInicial = limparPedidosExpirados(snapshotPedidos)
            let limpos = snapshotPedidos

            if (limpezaInicial.mudou) {
              limpos = await mutarPedidos<Pedido, Pedido[]>((pedidosFrescos) => {
                const limpezaAtual = limparPedidosExpirados(pedidosFrescos)
                return limpezaAtual.mudou
                  ? { persistir: true, pedidos: limpezaAtual.pedidos, resultado: limpezaAtual.pedidos }
                  : { persistir: false, resultado: pedidosFrescos }
              })
            }
          '''
          r = r[:start] + new_block + r[end:]
          route.write_text(r)
          PY

      - name: Testes focados da economia e fluxos protegidos
        run: >-
          npm test --
          src/lib/pollingVisivel.test.ts
          src/app/pedidos/pollingEconomia.page.test.ts
          src/app/pedidos/page.test.ts
          src/app/pedidos/pixSeguranca.page.test.ts
          src/app/pedidos/pixModalFechamento.regression.test.ts
          src/app/api/orders/route.economia.test.ts
          src/app/api/orders/route.edicao.test.ts
          src/app/api/orders/route.escalonamento.test.ts
          src/app/api/orders/route.lostUpdateAuditoria.test.ts
          src/app/api/orders/route.impressaoAutomatica.test.ts

      - name: Lint dos arquivos novos e comparar page/route com baseline da main
        shell: bash
        run: |
          npm run lint -- src/lib/pollingVisivel.ts src/lib/pollingVisivel.test.ts src/app/pedidos/pollingEconomia.page.test.ts src/app/api/orders/route.economia.test.ts

          comparar_lint() {
            local arquivo="$1"
            local tmp="/tmp/$(echo "$arquivo" | tr '/' '_')"
            cp "$arquivo" "${tmp}.patch"
            git show "origin/main:${arquivo}" > "$arquivo"
            set +e
            npm run lint -- "$arquivo" > "${tmp}.main.log" 2>&1
            cp "${tmp}.patch" "$arquivo"
            npm run lint -- "$arquivo" > "${tmp}.patch.log" 2>&1
            set -e
            strip() { sed -r 's/\x1B\[[0-9;]*[mK]//g' "$1"; }
            main_summary=$(strip "${tmp}.main.log" | grep -E '✖ [0-9]+ problems' | tail -1 || true)
            patch_summary=$(strip "${tmp}.patch.log" | grep -E '✖ [0-9]+ problems' | tail -1 || true)
            main_n=$(echo "$main_summary" | grep -oE '[0-9]+' | head -1 || echo 0)
            patch_n=$(echo "$patch_summary" | grep -oE '[0-9]+' | head -1 || echo 0)
            echo "$arquivo: main=$main_n patch=$patch_n"
            if [ "$patch_n" -gt "$main_n" ]; then
              echo "Regressão de lint em $arquivo"
              exit 1
            fi
          }

          comparar_lint src/app/pedidos/page.tsx
          comparar_lint src/app/api/orders/route.ts

      - name: Whitespace e build de produção
        run: |
          git diff --check origin/main -- src/lib/pollingVisivel.ts src/lib/pollingVisivel.test.ts src/app/pedidos/page.tsx src/app/pedidos/pollingEconomia.page.test.ts src/app/api/orders/route.ts src/app/api/orders/route.economia.test.ts
          npm run build

      - name: Restaurar CI original e gravar somente o patch validado
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/pedidos-operacional-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pollingVisivel.ts src/lib/pollingVisivel.test.ts src/app/pedidos/page.tsx src/app/pedidos/pollingEconomia.page.test.ts src/app/api/orders/route.ts src/app/api/orders/route.economia.test.ts .github/workflows/pedidos-operacional-ci.yml
          git commit -m "perf(economia): reduz polling e mutex Redis desnecessários"
          git push origin HEAD:perf/economia-polling-redis-20260822

  pedidos-operacional-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'perf/economia-polling-redis-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do SHA validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados do expediente e cobrança operacional
        run: >-
          npm test --
          src/lib/expedienteOperacional.test.ts
          src/lib/pedidosPainelOperacional.test.ts
          src/lib/limpezaOperacionalPedidos.test.ts
          src/components/LimpezaOperacionalPainel.contrato.test.ts

      - name: Lint dos arquivos da mudança
        run: >-
          npm run lint --
          src/lib/expedienteOperacional.ts
          src/lib/expedienteOperacional.test.ts
          src/lib/pedidosPainelOperacional.ts
          src/lib/pedidosPainelOperacional.test.ts
          src/lib/limpezaOperacionalPedidos.ts
          src/lib/limpezaOperacionalPedidos.test.ts
          src/components/LimpezaOperacionalPainel.tsx
          src/components/LimpezaOperacionalPainel.contrato.test.ts
          src/app/api/orders-painel/route.ts
          src/app/api/cron/route.ts
          src/lib/numeracao.ts
          src/middleware.ts
