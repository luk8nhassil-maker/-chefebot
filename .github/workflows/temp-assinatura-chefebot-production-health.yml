name: temp-assinatura-chefebot-production-health

on:
  pull_request:
    paths:
      - ".github/workflows/temp-assinatura-chefebot-production-health.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnosticar bloqueio da assinatura em produção
        shell: bash
        run: |
          set -euo pipefail
          falhou=0
          for url in \
            "https://chefedapizza.com.br/api/assinatura/operacao" \
            "https://chefebot-contingencia.vercel.app/api/assinatura/operacao"
          do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 20 --output "$tmp" --write-out '%{http_code}' "$url" || true)"
            body="$(cat "$tmp")"
            rm -f "$tmp"
            printf '%s -> HTTP %s -> %s\n' "$url" "$status" "$body"
            if [[ "$status" != "200" ]]; then
              falhou=1
              continue
            fi
            if ! node -e 'const body=JSON.parse(process.argv[1]); process.exit(body.blocked === true ? 0 : 1)' "$body"; then
              echo "ASSINATURA_NAO_BLOQUEADA: $url"
              falhou=1
            fi
          done
          if [[ "$falhou" != "0" ]]; then
            echo "HEALTH_FAIL: pelo menos um domínio de produção não está bloqueando a operação"
            exit 1
          fi
          echo "HEALTH_OK: assinatura bloqueada em produção até confirmação de pagamento"
