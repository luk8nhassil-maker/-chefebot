name: tmp-salao-opcionais-sim-nao-v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-salao-opcionais-sim-nao-v3.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: feat/salao-opcionais-sim-nao
          fetch-depth: 0

      - name: Aplicar patch auditado e asserções finais
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/tmp-salao-opcionais-sim-nao.yml | tail -n +2 | sed '$d' | sed 's/^          //' > /tmp/aplicar.py
          python /tmp/aplicar.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/salao/page.test.tsx')
          t = p.read_text()
          for nome in ('Catupiry', 'Bacon', 'Ovo'):
              t = t.replace(f'findByRole("button", {{ name: "{nome}" }})', f'findByRole("button", {{ name: /{nome}/ }})')
              t = t.replace(f'getByRole("button", {{ name: "{nome}" }})', f'getByRole("button", {{ name: /{nome}/ }})')
          t = t.replace('expect(screen.getByText("R$ 45,00")).toBeInTheDocument();', 'expect(screen.getAllByText("R$ 45,00").length).toBeGreaterThan(0);')
          t = t.replace('expect(screen.getByText("R$ 35,00")).toBeInTheDocument();', 'expect(screen.getAllByText("R$ 35,00").length).toBeGreaterThan(0);')
          p.write_text(t)
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados do Salão
        run: npm test -- src/app/salao/page.test.tsx

      - name: Lint dos arquivos alterados
        run: npm run lint -- src/app/salao/page.tsx src/app/salao/page.test.tsx

      - name: Build de produção
        run: npm run build

      - name: Commitar somente o patch validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/salao/page.tsx src/app/salao/page.test.tsx
          git diff --cached --check
          git commit -m "feat(salao): simplifica bordas e adicionais opcionais"
          git push origin HEAD:feat/salao-opcionais-sim-nao
