name: tmp-salao-opcionais-sim-nao

on:
  push:
    branches:
      - feat/salao-opcionais-sim-nao
    paths:
      - .github/workflows/tmp-salao-opcionais-sim-nao.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: feat/salao-opcionais-sim-nao
          fetch-depth: 0

      - name: Aplicar fluxo Sim/Não nos opcionais do Salão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/salao/page.tsx')
          text = page.read_text()

          old = '''  etapaSatisfeita,\n  indiceEtapaPendente,\n  montagemCompleta,\n  motivoBloqueio,\n  resumoEtapa,\n  alternarSabor,'''
          new = '''  etapaSatisfeita,\n  montagemCompleta,\n  motivoBloqueio,\n  resumoEtapa,\n  alternarAdicional,\n  alternarSabor,'''
          if old not in text:
              raise SystemExit('imports esperados não encontrados')
          text = text.replace(old, new, 1)

          start = text.index('  const [produtoAberto, setProdutoAberto] = useState<ProdutoManual | null>(null)')
          end_line = '  const completa = montagemCompleta(etapas, selecao)\n'
          end = text.index(end_line, start) + len(end_line)
          state_block = '''  const [produtoAberto, setProdutoAberto] = useState<ProdutoManual | null>(null)\n  const [selecao, setSelecao] = useState<SelecaoMontagem>(selecaoVazia())\n  const [etapaVisivel, setEtapaVisivel] = useState(0)\n  const [opcionaisAbertas, setOpcionaisAbertas] = useState<Set<number>>(() => new Set())\n  // ESC/armadilha de foco no construtor guiado (tela cheia, sem página\n  // rolável embaixo — não precisa travar scroll). ESC chama a mesma\n  // voltarEtapa do botão "Voltar": em opcionais já abertos volta primeiro\n  // para a pergunta Sim/Não; nas demais etapas recua normalmente.\n  const produtoAbertoRef = useDialogA11y(!!produtoAberto, () => voltarEtapa(), { travarScroll: false })\n  const etapas = useMemo(() => (produtoAberto ? montarEtapas(produtoAberto, menu) : []), [produtoAberto, menu])\n  const etapaAtual = etapas[etapaVisivel]\n  const etapaOpcional = etapaAtual?.tipo === "borda" || etapaAtual?.tipo === "adicionais" || etapaAtual?.tipo === "adicional_opcional"\n  const opcionalAberta = !!etapaOpcional && opcionaisAbertas.has(etapaVisivel)\n  const mostrarPerguntaOpcional = !!etapaOpcional && !opcionalAberta\n\n  // Busca dentro da etapa de sabor — mesma regra do pedido manual. As opções\n  // sentinela "Sem borda"/"Nenhum" ficam escondidas no Salão: a decisão de\n  // não querer adicional acontece na pergunta simples anterior.\n  const [termoEtapa, setTermoEtapa] = useState("")\n  const [termoEtapaChave, setTermoEtapaChave] = useState({ etapaVisivel, produtoAberto })\n  if (termoEtapaChave.etapaVisivel !== etapaVisivel || termoEtapaChave.produtoAberto !== produtoAberto) {\n    setTermoEtapaChave({ etapaVisivel, produtoAberto })\n    setTermoEtapa("")\n  }\n  const opcoesEtapaVisiveis = etapaAtual\n    ? etapaAtual.opcoes.filter((o) => !((etapaAtual.tipo === "borda" || etapaAtual.tipo === "adicional_opcional") && o.valor === ""))\n    : []\n  const etapaTemBusca = !mostrarPerguntaOpcional && (etapaAtual?.tipo === "sabores" || etapaAtual?.tipo === "sabor_unico") && opcoesEtapaVisiveis.length > 6\n  const termoEtapaNorm = norm(termoEtapa.trim())\n  const opcoesEtapaFiltradas = termoEtapaNorm\n    ? opcoesEtapaVisiveis.filter((o) => norm(o.label).includes(termoEtapaNorm) || (o.ingredientes ? norm(o.ingredientes).includes(termoEtapaNorm) : false))\n    : opcoesEtapaVisiveis\n\n  const bloqueioOpcional = mostrarPerguntaOpcional\n    ? null\n    : etapaAtual?.tipo === "borda" && !selecao.borda\n      ? "Escolha uma borda para continuar."\n      : etapaAtual?.tipo === "adicionais" && (selecao.adicionais?.length ?? 0) === 0\n        ? "Escolha pelo menos 1 adicional para continuar."\n        : etapaAtual?.tipo === "adicional_opcional" && !selecao.adicionalOpcional\n          ? "Escolha 1 adicional para continuar."\n          : null\n  const bloqueio = mostrarPerguntaOpcional ? null : (bloqueioOpcional ?? motivoBloqueio(etapaAtual, selecao))\n  const perguntaOpcional = etapaAtual?.tipo === "borda"\n    ? "Vai querer borda?"\n    : etapaAtual?.tipo === "adicionais"\n      ? "Vai querer adicionais?"\n      : etapaAtual?.tipo === "adicional_opcional"\n        ? "Vai querer adicional?"\n        : null\n  const ajudaEtapa = mostrarPerguntaOpcional\n    ? "Escolha Sim ou Não."\n    : etapaAtual?.tipo === "borda"\n      ? "Escolha a borda."\n      : etapaAtual?.tipo === "adicionais"\n        ? "Escolha um ou mais adicionais."\n        : etapaAtual?.tipo === "adicional_opcional"\n          ? "Escolha 1 adicional."\n          : etapaAtual?.ajuda\n'''
          text = text[:start] + state_block + text[end:]

          start = text.index('  function abrirProduto(produto: ProdutoManual) {')
          end = text.index('\n  const total = itens.reduce', start)
          funcs = '''  function abrirProduto(produto: ProdutoManual) {\n    if (produto.esgotado) return\n    if (!produto.requerMontagem) {\n      const item = construirItemManual(produto, selecaoVazia(), menu)\n      if (item) confirmarAdicao(item)\n      return\n    }\n    setProdutoAberto(produto)\n    setSelecao(selecaoVazia())\n    setEtapaVisivel(0)\n    setOpcionaisAbertas(new Set())\n    setCategoria(produto.categoria)\n  }\n\n  function finalizarMontagem(selecaoFinal: SelecaoMontagem) {\n    if (!produtoAberto || !montagemCompleta(etapas, selecaoFinal)) return\n    const item = construirItemManual(produtoAberto, selecaoFinal, menu)\n    if (item) confirmarAdicao(item)\n    setProdutoAberto(null)\n    setOpcionaisAbertas(new Set())\n    setTermo("")\n  }\n\n  function avancarEtapa() {\n    if (!etapaAtual || mostrarPerguntaOpcional || bloqueio) return\n    if (!etapaOpcional && !etapaSatisfeita(etapaAtual, selecao)) return\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagem(selecao)\n  }\n\n  function responderOpcional(quer: boolean) {\n    if (!etapaAtual || !etapaOpcional) return\n    if (quer) {\n      setOpcionaisAbertas((atuais) => {\n        const proximas = new Set(atuais)\n        proximas.add(etapaVisivel)\n        return proximas\n      })\n      return\n    }\n\n    const novaSelecao: SelecaoMontagem = etapaAtual.tipo === "borda"\n      ? { ...selecao, borda: null }\n      : etapaAtual.tipo === "adicionais"\n        ? { ...selecao, adicionais: [] }\n        : { ...selecao, adicionalOpcional: null }\n    setSelecao(novaSelecao)\n    if (etapaVisivel < etapas.length - 1) {\n      setEtapaVisivel(etapaVisivel + 1)\n      return\n    }\n    finalizarMontagem(novaSelecao)\n  }\n\n  function voltarEtapa() {\n    if (etapaOpcional && opcionaisAbertas.has(etapaVisivel)) {\n      setOpcionaisAbertas((atuais) => {\n        const proximas = new Set(atuais)\n        proximas.delete(etapaVisivel)\n        return proximas\n      })\n      return\n    }\n    if (etapaVisivel > 0) setEtapaVisivel(etapaVisivel - 1)\n    else setProdutoAberto(null)\n  }\n\n  function escolher(valor: string) {\n    if (!etapaAtual) return\n    if (etapaAtual.tipo === "sabores" || etapaAtual.tipo === "sabor_unico") {\n      setSelecao((s) => alternarSabor(s, valor, etapaAtual.maxEscolhas))\n    } else if (etapaAtual.tipo === "borda") {\n      setSelecao((s) => ({ ...s, borda: valor || null }))\n    } else if (etapaAtual.tipo === "adicionais") {\n      setSelecao((s) => alternarAdicional(s, valor))\n    } else if (etapaAtual.tipo === "adicional_opcional") {\n      setSelecao((s) => ({ ...s, adicionalOpcional: valor || null }))\n    } else if (etapaAtual.tipo === "tamanho_item") {\n      setSelecao((s) => ({ ...s, tamanhoItem: valor }))\n    } else if (etapaAtual.tipo === "leite") {\n      setSelecao((s) => ({ ...s, leite: valor === "com" ? "com" : "sem" }))\n    }\n  }\n\n  function estaEscolhida(valor: string): boolean {\n    if (!etapaAtual) return false\n    switch (etapaAtual.tipo) {\n      case "sabores": case "sabor_unico": return selecao.sabores.includes(valor)\n      case "borda": return selecao.borda === valor\n      case "adicionais": return selecao.adicionais?.includes(valor) ?? false\n      case "adicional_opcional": return selecao.adicionalOpcional === valor\n      case "tamanho_item": return selecao.tamanhoItem === valor\n      case "leite": return selecao.leite === valor\n      default: return false\n    }\n  }\n'''
          text = text[:start] + funcs + text[end:]

          old = '<p style={{ fontSize: 12.5, fontWeight: 600, color: "var(--foreground-secondary)", margin: 0 }}>{etapaAtual.ajuda}</p>'
          new = '<p style={{ fontSize: 12.5, fontWeight: 600, color: "var(--foreground-secondary)", margin: 0 }}>{ajudaEtapa}</p>'
          if old not in text:
              raise SystemExit('ajuda da etapa não encontrada')
          text = text.replace(old, new, 1)

          old = '''            {etapas.map((e, i) => {\n              const resumo = resumoEtapa(e, selecao)\n              if (!resumo) return null'''
          new = '''            {etapas.map((e, i) => {\n              const opcionalAindaNaoDecidida =\n                (e.tipo === "adicionais" && selecao.adicionais === undefined) ||\n                (e.tipo === "adicional_opcional" && selecao.adicionalOpcional === undefined)\n              if (opcionalAindaNaoDecidida) return null\n              const resumo = resumoEtapa(e, selecao)\n              if (!resumo) return null'''
          if old not in text:
              raise SystemExit('chips de resumo não encontrados')
          text = text.replace(old, new, 1)

          content_start = text.index('          {etapaTemBusca && (')
          footer_marker = '          <div style={{ borderTop: "1px solid var(--surface)", padding: "12px 16px calc(12px + env(safe-area-inset-bottom))", flexShrink: 0, display: "grid", gap: 8 }}>'
          content_end = text.index(footer_marker, content_start)
          modal_content = '''          {mostrarPerguntaOpcional ? (\n            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>\n              <div style={{ ...card, width: "100%", maxWidth: 360, display: "grid", gap: 14, textAlign: "center" }}>\n                <p style={{ margin: 0, fontSize: 20, fontWeight: 900, color: "var(--foreground)" }}>{perguntaOpcional}</p>\n                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>\n                  <button onClick={() => responderOpcional(true)} style={btnPrimario}>Sim</button>\n                  <button onClick={() => responderOpcional(false)} style={btnSecundario}>Não</button>\n                </div>\n              </div>\n            </div>\n          ) : (\n            <>\n              {etapaTemBusca && (\n                <div style={{ position: "relative", padding: "0 16px 4px", flexShrink: 0 }}>\n                  <Search size={16} aria-hidden="true" style={{ position: "absolute", left: 28, top: 16, color: "var(--foreground-muted)" }} />\n                  <input style={{ ...input, paddingLeft: 36 }} placeholder="Buscar sabor…" value={termoEtapa} onChange={(e) => setTermoEtapa(e.target.value)} aria-label="Buscar sabor" />\n                </div>\n              )}\n              <div style={{ flex: 1, overflowY: "auto", padding: "4px 16px 16px", display: "grid", gap: 8, alignContent: "start" }}>\n                {etapaTemBusca && opcoesEtapaFiltradas.length === 0 && (\n                  <p style={{ fontSize: 13, color: "var(--foreground-muted)", textAlign: "center" }}>Nenhum sabor encontrado.</p>\n                )}\n                {opcoesEtapaFiltradas.map((o) => {\n                  const sel = estaEscolhida(o.valor)\n                  return (\n                    <button key={o.valor || "__sem__"} onClick={() => !o.esgotado && escolher(o.valor)} disabled={o.esgotado} style={{ ...card, minHeight: 48, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, textAlign: "left", cursor: o.esgotado ? "not-allowed" : "pointer", opacity: o.esgotado ? 0.45 : 1, borderColor: sel ? "var(--primary)" : "var(--surface-secondary)", background: sel ? "color-mix(in srgb, var(--primary) 12%, transparent)" : "var(--surface)" }}>\n                      <span style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 0 }}>\n                        <span style={{ fontSize: 14, fontWeight: 800, color: "var(--foreground)" }}>{o.label}{o.esgotado ? " · esgotado" : ""}</span>\n                        {!o.esgotado && o.ingredientes ? (\n                          <span style={{ fontSize: 11.5, color: "var(--foreground-muted)", lineHeight: 1.35, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>\n                            {o.ingredientes}\n                          </span>\n                        ) : null}\n                      </span>\n                      <span style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>\n                        {o.extra ? <span style={{ fontSize: 12.5, fontWeight: 800, color: "var(--brand-text)" }}>+{money(o.extra)}</span> : null}\n                        {sel ? <span style={{ fontSize: 14, color: "var(--primary)" }}>✓</span> : null}\n                      </span>\n                    </button>\n                  )\n                })}\n              </div>\n            </>\n          )}\n'''
          text = text[:content_start] + modal_content + text[content_end:]

          old_footer = '''          <div style={{ borderTop: "1px solid var(--surface)", padding: "12px 16px calc(12px + env(safe-area-inset-bottom))", flexShrink: 0, display: "grid", gap: 8 }}>\n            {bloqueio && <p role="status" aria-live="polite" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--attention-text)", margin: 0, textAlign: "center" }}>{bloqueio}</p>}\n            <div style={{ display: "flex", gap: 8 }}>\n              <button onClick={voltarEtapa} style={{ ...btnSecundario, flex: 1 }}>\n                {etapaVisivel > 0 ? "Voltar" : "Cancelar item"}\n              </button>\n              {indiceEtapaPendente(etapas, selecao) === -1 ? (\n                <button onClick={confirmarMontagem} style={{ ...btnPrimario, flex: 2 }}>Adicionar</button>\n              ) : (\n                <button onClick={avancarEtapa} disabled={!!bloqueio} style={{ ...btnPrimario, flex: 2, ...(bloqueio ? btnDesabilitado : {}) }}>\n                  {etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Continuar"}\n                </button>\n              )}\n            </div>\n          </div>'''
          new_footer = '''          <div style={{ borderTop: "1px solid var(--surface)", padding: "12px 16px calc(12px + env(safe-area-inset-bottom))", flexShrink: 0, display: "grid", gap: 8 }}>\n            {!mostrarPerguntaOpcional && bloqueio && <p role="status" aria-live="polite" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--attention-text)", margin: 0, textAlign: "center" }}>{bloqueio}</p>}\n            <div style={{ display: "flex", gap: 8 }}>\n              <button onClick={voltarEtapa} style={{ ...btnSecundario, flex: 1 }}>\n                {etapaVisivel > 0 ? "Voltar" : "Cancelar item"}\n              </button>\n              {!mostrarPerguntaOpcional && (\n                <button onClick={avancarEtapa} disabled={!!bloqueio} style={{ ...btnPrimario, flex: 2, ...(bloqueio ? btnDesabilitado : {}) }}>\n                  {etapaVisivel < etapas.length - 1 ? `Continuar para ${etapas[etapaVisivel + 1].titulo.toLowerCase()}` : "Adicionar"}\n                </button>\n              )}\n            </div>\n          </div>'''
          if old_footer not in text:
              raise SystemExit('footer antigo do modal não encontrado')
          text = text.replace(old_footer, new_footer, 1)
          page.write_text(text)

          test = Path('src/app/salao/page.test.tsx')
          t = test.read_text()

          fixture_anchor = '''const CARDAPIO_TESTE = {\n  sizes: [], saltyFlavors: [], sweetFlavors: [], borders: [],\n  bebidas: [{ name: "Refrigerante 2L", price: 12 }, { name: "Água com gás", price: 6 }],\n  sucos: [], neighborhoods: [],\n};\n'''
          fixture_extra = fixture_anchor + '''\nconst CARDAPIO_PIZZA_OPCIONAIS = {\n  ...CARDAPIO_TESTE,\n  pizzaCatalog: {\n    sizes: [{ id: "pizza-p", code: "P", label: "Pequena", fatias: 4 }],\n    flavors: [{ id: "mussarela", name: "Mussarela", category: "tradicional", ingredients: "", available: true, pricesBySizeCode: { P: 3300 } }],\n    borders: [{ id: "borda-catupiry", label: "Catupiry", available: true, pricesBySizeCode: { P: 500, M: 500, G: 500, F: 500 } }],\n    addOns: [{ id: "add-bacon", label: "Bacon", available: true, pricesBySizeCode: { P: 700, M: 700, G: 700, F: 700 } }],\n  },\n};\n\nconst CARDAPIO_PRODUTO_ADICIONAL = {\n  ...CARDAPIO_TESTE,\n  catalog: {\n    lanches: [], hamburgueres: [], calzone: [], pastelForno: [],\n    macarronadas: [{\n      id: "mac-teste", name: "Macarronada Teste", priceCents: 3000, available: true, strategy: "size",\n      sizes: [{ id: "mac-p", code: "P", priceCents: 3000 }],\n      addOnGroup: { max: 1, options: [{ id: "add-ovo", label: "Ovo", priceCents: 500, available: true }] },\n    }],\n    sucos: [], vitaminas: [], bebidas: [],\n  },\n};\n'''
          if fixture_anchor not in t:
              raise SystemExit('fixture base não encontrada')
          t = t.replace(fixture_anchor, fixture_extra, 1)

          old = 'let enviosCriados = 0;\n'
          new = 'let enviosCriados = 0;\nlet cardapioAtual: unknown = CARDAPIO_TESTE;\n'
          if old not in t:
              raise SystemExit('estado dos mocks não encontrado')
          t = t.replace(old, new, 1)

          old = '''  falharProximaListagem = false;\n  enviosCriados = 0;\n}'''
          new = '''  falharProximaListagem = false;\n  enviosCriados = 0;\n  cardapioAtual = CARDAPIO_TESTE;\n}'''
          if old not in t:
              raise SystemExit('resetMock não encontrado')
          t = t.replace(old, new, 1)

          old = '  if (url === "/api/cardapio" && method === "GET") return jsonRes(200, CARDAPIO_TESTE);'
          new = '  if (url === "/api/cardapio" && method === "GET") return jsonRes(200, cardapioAtual);'
          if old not in t:
              raise SystemExit('mock de cardápio não encontrado')
          t = t.replace(old, new, 1)

          helper_anchor = '''  async function iniciarAtendimento(user: ReturnType<typeof userEvent.setup>) {\n    render(<SalaoPage />);\n    await user.click(await screen.findByRole("button", { name: "Começar novo atendimento" }));\n    await user.type(screen.getByLabelText("Nome do cliente"), "Ana");\n    await user.click(screen.getByRole("button", { name: "Sem mesa" }));\n    await user.click(screen.getByRole("button", { name: "Escolher produtos" }));\n    await screen.findByPlaceholderText("Buscar produto…");\n  }\n'''
          tests = helper_anchor + '''\n  async function abrirPizzaComSabor(user: ReturnType<typeof userEvent.setup>) {\n    cardapioAtual = CARDAPIO_PIZZA_OPCIONAIS;\n    await iniciarAtendimento(user);\n    await user.click(await screen.findByRole("button", { name: /Pizza Pequena/ }));\n    await user.click(await screen.findByRole("button", { name: /Mussarela/ }));\n    await user.click(screen.getByRole("button", { name: "Continuar para borda" }));\n  }\n\n  it("opcionais perguntam Sim/Não e Não pula borda/adicionais sem exibir listas", async () => {\n    const user = userEvent.setup();\n    await abrirPizzaComSabor(user);\n\n    expect(await screen.findByText("Vai querer borda?")).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Catupiry" })).not.toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Não" }));\n\n    expect(await screen.findByText("Vai querer adicionais?")).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Bacon" })).not.toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Não" }));\n\n    await waitFor(() => expect(screen.queryByRole("dialog", { name: /Montar Pizza Pequena/ })).not.toBeInTheDocument());\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n  });\n\n  it("Sim revela somente as opções reais de borda/adicionais e exige escolha", async () => {\n    const user = userEvent.setup();\n    await abrirPizzaComSabor(user);\n\n    await user.click(await screen.findByRole("button", { name: "Sim" }));\n    expect(await screen.findByRole("button", { name: "Catupiry" })).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Sem borda" })).not.toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Continuar para adicionais" })).toBeDisabled();\n    await user.click(screen.getByRole("button", { name: "Catupiry" }));\n    await user.click(screen.getByRole("button", { name: "Continuar para adicionais" }));\n\n    expect(await screen.findByText("Vai querer adicionais?")).toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Sim" }));\n    expect(await screen.findByRole("button", { name: "Bacon" })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: "Adicionar" })).toBeDisabled();\n    await user.click(screen.getByRole("button", { name: "Bacon" }));\n    await user.click(screen.getByRole("button", { name: "Adicionar" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getByText("R$ 45,00")).toBeInTheDocument();\n  });\n\n  it("adicional opcional único também usa Sim/Não antes de mostrar opções", async () => {\n    const user = userEvent.setup();\n    cardapioAtual = CARDAPIO_PRODUTO_ADICIONAL;\n    await iniciarAtendimento(user);\n    await user.type(screen.getByPlaceholderText("Buscar produto…"), "Macarronada Teste");\n    await user.click(await screen.findByRole("button", { name: /Macarronada Teste/ }));\n    await user.click(await screen.findByRole("button", { name: "Tamanho P" }));\n    await user.click(screen.getByRole("button", { name: "Continuar para adicional" }));\n\n    expect(await screen.findByText("Vai querer adicional?")).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Ovo" })).not.toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Sim" }));\n    expect(await screen.findByRole("button", { name: "Ovo" })).toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: "Nenhum" })).not.toBeInTheDocument();\n    await user.click(screen.getByRole("button", { name: "Ovo" }));\n    await user.click(screen.getByRole("button", { name: "Adicionar" }));\n\n    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();\n    expect(screen.getByText("R$ 35,00")).toBeInTheDocument();\n  });\n'''
          if helper_anchor not in t:
              raise SystemExit('helper iniciarAtendimento não encontrado')
          t = t.replace(helper_anchor, tests, 1)
          test.write_text(t)
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados do Salão
        run: npm test -- src/app/salao/page.test.tsx

      - name: Lint dos arquivos alterados
        run: npm run lint -- src/app/salao/page.tsx src/app/salao/page.test.tsx

      - name: Build de produção
        run: npm run build

      - name: Commitar somente o patch validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/salao/page.tsx src/app/salao/page.test.tsx
          git diff --cached --check
          git commit -m "feat(salao): simplifica bordas e adicionais opcionais"
          git push origin HEAD:feat/salao-opcionais-sim-nao
