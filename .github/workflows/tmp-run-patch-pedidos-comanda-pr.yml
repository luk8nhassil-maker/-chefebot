name: tmp-run-patch-pedidos-comanda-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/pedidos-comanda-card-unificado-20260820' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pedidos-comanda-card-unificado-20260820
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar patch mínimo validado
        shell: bash
        run: |
          git show ce116d40b1ca789b4f6f39746ff1609ef1d0a625:.github/workflows/tmp-run-patch-pedidos-comanda-pr.yml > /tmp/runner-patch.yml
          python - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/runner-patch.yml').read_text()
          marker = "      - name: Aplicar patch mínimo\n"
          section = workflow[workflow.index(marker):]
          start_marker = "          python - <<'PY'\n"
          start = section.index(start_marker) + len(start_marker)
          end = section.index("\n          PY", start)
          lines = section[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<patch-pedidos-comanda>', 'exec'))
          PY
          rm -f .tmp-trigger-pedidos-comanda README.tmp-noop .github/workflows/tmp-patch-pedidos-comanda-card.yml .github/workflows/tmp-run-patch-pedidos-comanda-pr.yml
      - name: Instalar dependências
        run: npm ci
      - name: Testes focados
        run: npx vitest run src/lib/pedidoComandaPainel.test.ts src/app/pedidos/page.test.ts
      - name: Lint sem regressão contra main
        shell: bash
        run: |
          npx eslint src/app/pedidos/page.test.ts src/lib/pedidoComandaPainel.ts src/lib/pedidoComandaPainel.test.ts
          npx eslint src/app/pedidos/page.tsx --format json > /tmp/lint-branch.json || true
          cp src/app/pedidos/page.tsx /tmp/page-patched.tsx
          git show origin/main:src/app/pedidos/page.tsx > src/app/pedidos/page.tsx
          npx eslint src/app/pedidos/page.tsx --format json > /tmp/lint-main.json || true
          cp /tmp/page-patched.tsx src/app/pedidos/page.tsx
          python - <<'PY'
          import json
          from collections import Counter

          def counter(path):
              data = json.load(open(path))
              msgs = data[0].get('messages', []) if data else []
              return Counter((m.get('ruleId'), m.get('message')) for m in msgs if m.get('severity') == 2)

          branch = counter('/tmp/lint-branch.json')
          main = counter('/tmp/lint-main.json')
          novas = branch - main
          if novas:
              raise SystemExit(f'Novos erros de lint introduzidos: {dict(novas)}')
          print(f'Lint sem regressão: main={sum(main.values())} erros, branch={sum(branch.values())} erros')
          PY
      - name: Build
        run: npm run build
      - name: Commitar patch validado e limpar temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[tmp-patch-done] fix(pedidos): unifica comanda do salão no painel"
          git push origin HEAD:fix/pedidos-comanda-card-unificado-20260820
