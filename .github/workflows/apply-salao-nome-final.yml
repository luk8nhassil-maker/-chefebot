name: apply-salao-nome-final

on:
  push:
    branches:
      - feat/salao-nome-no-final-20260821
    paths:
      - "scripts/apply_salao_nome_final.py"
      - ".github/workflows/apply-salao-nome-final.yml"

permissions:
  contents: write

concurrency:
  group: apply-salao-nome-final
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: feat/salao-nome-no-final-20260821
          fetch-depth: 0

      - name: Aplicar patch determinístico
        run: python scripts/apply_salao_nome_final.py

      - name: Remover ferramenta temporária
        run: git rm scripts/apply_salao_nome_final.py .github/workflows/apply-salao-nome-final.yml

      - name: Commitar somente o patch final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(salao): pede nome somente no final do pedido"
          git push origin HEAD:feat/salao-nome-no-final-20260821
