name: Salao critico 1 fixture temporario

on:
  push:
    branches:
      - codex/salao-status-operacional-critico-1

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/salao-status-operacional-critico-1
          fetch-depth: 0
      - run: |
          if grep -Fq 'pedidoNumero: 1, pedidoStatus: "novo"' src/app/salao/page.test.tsx; then exit 0; fi
          node scripts/patch-salao-critico-1-test-fixture.mjs
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/salao/page.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(salao): representa status oficial no fixture legado'
          git push origin HEAD:codex/salao-status-operacional-critico-1
