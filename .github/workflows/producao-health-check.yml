name: producao-health-check

# Sonda SOMENTE-LEITURA de produção (chefedapizza.com.br).
#
# Só faz GET em rotas públicas ou que respondem 401 sem cookie. Nunca envia
# credencial, nunca cria pedido, nunca escreve em Redis/banco, nunca dispara
# WhatsApp/Pix/impressão. O corpo impresso é truncado e vem de endpoints que
# não retornam PII (status do bot, erro de autorização, status de assinatura).
#
# Serve para responder, com evidência, "qual dependência de /pedidos está
# falhando em produção" — sem depender de acesso ao painel da Vercel.

# Execução sob demanda apenas: é uma ferramenta de plantão, não um cron que
# acorda função Vercel de graça.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao-health-check
  cancel-in-progress: true

jobs:
  sondar:
    name: sondar-producao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GETs somente-leitura em produção
        run: |
          BASE="https://chefedapizza.com.br"

          sondar() {
            local rota="$1"
            local descricao="$2"
            echo "=============================================="
            echo "ROTA: ${rota}"
            echo "O QUE MEDE: ${descricao}"
            local metricas
            metricas=$(curl -sS -o /tmp/corpo.txt -D /tmp/headers.txt \
              -w 'status=%{http_code} tempo_total=%{time_total}s tamanho=%{size_download}B' \
              --max-time 45 \
              -H 'Accept: application/json' \
              "${BASE}${rota}" 2>&1) || metricas="FALHA_DE_REDE: $?"
            echo "${metricas}"
            echo "--- headers relevantes ---"
            grep -i -E '^(x-vercel-id|x-vercel-error|x-matched-path|location|content-type|age|x-vercel-cache):' /tmp/headers.txt || true
            echo "--- corpo (truncado em 500 caracteres) ---"
            head -c 500 /tmp/corpo.txt || true
            echo
          }

          echo "### 1) O datastore responde? (tres tentativas — descarta flake)"
          sondar "/api/bot-status" "SAUDE DO DATASTORE: rota publica cujo corpo inteiro e um redis.get('bot_ativo'). 200 = datastore respondendo; 5xx = datastore/credencial quebrados."
          sondar "/api/bot-status" "Repeticao 2 — falha consistente nao e flake."
          sondar "/api/bot-status" "Repeticao 3 — falha consistente nao e flake."

          echo "### 2) Outras rotas publicas que leem o mesmo datastore"
          sondar "/api/cardapio" "Cardapio publico (force-dynamic, le cardapio/esgotados do datastore). 200 = leitura funciona; 5xx = datastore fora."
          sondar "/api/diagnostico/datastore" "Sonda classificada do datastore (existe so depois deste PR chegar em producao)."

          echo "### 3) Rotas do painel e do dominio"
          sondar "/api/orders" "Rota do painel SEM cookie. 401 JSON = rota viva; 5xx = quebra antes da autenticacao."
          sondar "/api/assinatura/operacao" "Gate de assinatura (deve responder blocked=false, pausado)."
          sondar "/pedidos" "Tela do painel sem cookie (esperado redirecionar para /login)."
          sondar "/?diag=1" "Raiz do dominio com cache-buster (rewrite para /cardapio)."

          echo "=============================================="
          echo "Sonda concluida. Nenhuma escrita foi feita em producao."
