name: tmp-patch-salao-receber

on:
  push:
    branches:
      - feat/salao-receber-pagamento-terminal
    paths:
      - .github/workflows/tmp-patch-salao-receber.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/salao-receber-pagamento-terminal
      - name: Aplicar patch mínimo no terminal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/salao/page.tsx')
          text = path.read_text()

          old_redirect = 'if (r.ok) { onAtualizado(); onVoltar() }'
          new_redirect = 'if (r.ok) { onAtualizado(); window.location.assign(`/salao/receber/${comanda.id}`) }'
          if text.count(old_redirect) != 1:
              raise SystemExit(f'Esperava 1 ocorrência do redirect antigo, encontrei {text.count(old_redirect)}')
          text = text.replace(old_redirect, new_redirect)

          old_label = '{fechando ? "Fechando…" : "Fechar mesa"}'
          new_label = '{fechando ? "Pedindo conta…" : "Pedir conta"}'
          if text.count(old_label) != 1:
              raise SystemExit(f'Esperava 1 ocorrência do rótulo antigo, encontrei {text.count(old_label)}')
          text = text.replace(old_label, new_label)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/app/salao/page.tsx

      - name: Commitar patch na branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/salao/page.tsx
          git commit -m "feat(salao): leva pagamento para o terminal"
          git push origin HEAD:feat/salao-receber-pagamento-terminal
