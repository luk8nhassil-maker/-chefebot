name: salao-operacional-ci

# Gate hermético do Salão. Não recebe segredos e não acessa Redis/WhatsApp/
# Pix/impressão reais: testes usam mocks locais e o build não executa writes.
on:
  pull_request:
    paths:
      - "src/app/salao/**"
      - "src/app/pedidos/salao/**"
      - "src/app/pedidos/layout.tsx"
      - "src/app/api/salao/**"
      - "src/components/SalaoOperacaoNav.tsx"
      - "src/components/PedidosSalaoNav.tsx"
      - "src/lib/comandas.ts"
      - "src/lib/comandas.test.ts"
      - "src/lib/salao*.ts"
      - "src/lib/salao*.test.ts"
      - ".github/workflows/salao-operacional-ci.yml"
  workflow_dispatch:

# TEMPORÁRIO nesta branch: write é usado somente no último step para gravar
# o patch já testado e restaurar este próprio workflow à versão da main.
permissions:
  contents: write

concurrency:
  group: salao-operacional-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  salao-operacional-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do SHA validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Aplicar patch mínimo de UX antes dos gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/app/salao/page.tsx')
          page = page_path.read_text()
          alvo = '''      <ContextoAtendimento comanda={comanda} />

      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ position: "relative" }}>'''
          novo = '''      <ContextoAtendimento comanda={comanda} />

      <div style={{ flex: 1, overflowY: "auto", padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
        {itens.length > 0 && (
          <section
            aria-label="Itens adicionados ao pedido"
            style={{ ...card, padding: "10px 12px", display: "grid", gap: 8 }}
          >
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
              <span style={{ fontSize: 11, fontWeight: 900, letterSpacing: ".45px", textTransform: "uppercase", color: "var(--foreground-muted)" }}>
                Itens no pedido
              </span>
              <span style={{ fontSize: 12.5, fontWeight: 900, color: "var(--brand-text)", whiteSpace: "nowrap" }}>
                {itens.length} item(ns) · {money(total)}
              </span>
            </div>
            <div style={{ display: "grid", gap: 6, maxHeight: 132, overflowY: "auto" }}>
              {itens.slice().reverse().map((item, i) => (
                <div key={`${item.name}-${item.detail}-${i}`} style={{ display: "grid", gridTemplateColumns: "auto minmax(0, 1fr) auto", alignItems: "center", gap: 8, minHeight: 32 }}>
                  <span style={{ minWidth: 28, height: 28, padding: "0 6px", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: "var(--primary-soft)", color: "var(--brand-text)", fontSize: 12, fontWeight: 900 }}>
                    {item.qty}×
                  </span>
                  <span style={{ minWidth: 0 }}>
                    <span style={{ display: "block", fontSize: 13.5, fontWeight: 800, color: "var(--foreground)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {item.name}
                    </span>
                    {item.detail && (
                      <span style={{ display: "block", fontSize: 11, color: "var(--foreground-muted)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {item.detail}
                      </span>
                    )}
                  </span>
                  <span style={{ fontSize: 12.5, fontWeight: 800, color: "var(--foreground-secondary)", whiteSpace: "nowrap" }}>
                    {money(item.price * item.qty)}
                  </span>
                </div>
              ))}
            </div>
          </section>
        )}
        <div style={{ position: "relative" }}>'''
          if page.count(alvo) != 1:
              raise SystemExit(f'marcador do catálogo inesperado: {page.count(alvo)}')
          page_path.write_text(page.replace(alvo, novo, 1))

          test_path = Path('src/app/salao/page.test.tsx')
          test = test_path.read_text()
          alvo_teste = '''    expect(await screen.findByText("Refrigerante 2L adicionado")).toBeInTheDocument();
    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();
    expect(screen.getByRole("button", { name: "Revisar pedido" })).toBeEnabled();'''
          novo_teste = '''    expect(await screen.findByText("Refrigerante 2L adicionado")).toBeInTheDocument();
    const resumoItens = screen.getByRole("region", { name: "Itens adicionados ao pedido" });
    expect(within(resumoItens).getByText("Itens no pedido")).toBeInTheDocument();
    expect(within(resumoItens).getByText("1×")).toBeInTheDocument();
    expect(within(resumoItens).getByText("Refrigerante 2L")).toBeInTheDocument();
    expect(within(resumoItens).getByText("R$ 12,00")).toBeInTheDocument();
    expect(await screen.findByText("1 item(ns)")).toBeInTheDocument();
    expect(screen.getByRole("button", { name: "Revisar pedido" })).toBeEnabled();'''
          if test.count(alvo_teste) != 1:
              raise SystemExit(f'marcador do teste inesperado: {test.count(alvo_teste)}')
          test_path.write_text(test.replace(alvo_teste, novo_teste, 1))
          PY
          git diff --check

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados e regressão do Salão
        run: >-
          npm test --
          src/lib/comandas.test.ts
          src/lib/salaoConta.test.ts
          src/lib/salaoPagamento.test.ts
          src/lib/salaoOperacao.test.ts
          src/app/api/salao/comandas/route.test.ts
          src/app/salao/page.test.tsx

      - name: Typecheck comparado com a main
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit > /tmp/typecheck-branch.log 2>&1
          branch_status=$?
          set -e

          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_sha" ]; then
            git fetch --depth=1 origin main
            base_sha="origin/main"
          else
            git fetch --depth=1 origin "$base_sha"
          fi

          git worktree add --detach /tmp/chefebot-main "$base_sha"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/chefebot-main/node_modules
          set +e
          (cd /tmp/chefebot-main && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit) > /tmp/typecheck-main.log 2>&1
          main_status=$?
          set -e

          echo "=== Typecheck da branch ==="
          cat /tmp/typecheck-branch.log
          echo "=== Typecheck da main/base ==="
          cat /tmp/typecheck-main.log

          sed -E 's#^([^(:]+\([^)]*\): error TS[0-9]+:).*#\1#' /tmp/typecheck-branch.log | grep 'error TS' | sort -u > /tmp/branch-errors.txt || true
          sed -E 's#^([^(:]+\([^)]*\): error TS[0-9]+:).*#\1#' /tmp/typecheck-main.log | grep 'error TS' | sort -u > /tmp/main-errors.txt || true
          comm -13 /tmp/main-errors.txt /tmp/branch-errors.txt > /tmp/new-errors.txt

          if [ -s /tmp/new-errors.txt ]; then
            echo "::error::A branch introduziu novos erros de typecheck em relação à main:"
            cat /tmp/new-errors.txt
            exit 1
          fi

          if [ "$branch_status" -ne 0 ]; then
            echo "Typecheck global permanece vermelho, mas somente por erros já presentes na main (main status=$main_status). Nenhum erro novo foi aceito."
          else
            echo "Typecheck da branch totalmente verde."
          fi

      - name: Lint dos arquivos alterados
        run: >-
          npm run lint --
          src/lib/salaoAmbiente.ts
          src/lib/salaoConta.ts
          src/lib/salaoConta.server.ts
          src/lib/salaoConta.test.ts
          src/lib/salaoEnvioInicial.server.ts
          src/lib/salaoOperacao.ts
          src/lib/salaoOperacao.test.ts
          src/lib/salaoPagamento.ts
          src/lib/salaoPagamento.test.ts
          src/app/api/salao/comandas/route.ts
          src/app/api/salao/comandas/route.test.ts
          src/app/api/salao/comandas/[id]/route.ts
          src/app/api/salao/comandas/[id]/enviar/route.ts
          src/app/api/salao/comandas/[id]/fechar/route.ts
          src/app/api/salao/comandas/[id]/conta/route.ts
          src/app/api/salao/comandas/[id]/rodadas/route.ts
          src/app/api/salao/comandas/[id]/rodadas/[rodadaId]/route.ts
          src/app/api/salao/comandas/[id]/rodadas/[rodadaId]/enviar/route.ts
          src/app/api/salao/comandas/[id]/envios/[pedidoId]/servir/route.ts
          src/app/api/salao/caixa/[id]/fechar/route.ts
          src/app/api/salao/operacao/route.ts
          src/app/salao/page.tsx
          src/app/salao/page.test.tsx
          src/app/salao/operacao/page.tsx
          src/app/salao/layout.tsx
          src/app/pedidos/salao/page.tsx
          src/app/pedidos/layout.tsx
          src/components/SalaoOperacaoNav.tsx
          src/components/PedidosSalaoNav.tsx

      - name: Build de produção
        run: npm run build

      - name: Persistir somente o patch validado e restaurar o workflow
        if: ${{ success() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git show "$base_sha:.github/workflows/salao-operacional-ci.yml" > .github/workflows/salao-operacional-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/salao/page.tsx src/app/salao/page.test.tsx .github/workflows/salao-operacional-ci.yml
          git commit -m "fix(salao): destaca itens adicionados no catálogo"
          git push origin HEAD:fix/salao-itens-visiveis-ux-v2-20260820
