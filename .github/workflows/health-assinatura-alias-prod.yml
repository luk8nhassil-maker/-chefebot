name: health-assinatura-alias-prod

on:
  pull_request:
    paths:
      - ".github/workflows/health-assinatura-alias-prod.yml"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Comparar bloqueio no domínio oficial e alias Vercel
        shell: bash
        run: |
          set -euo pipefail

          for base in "https://chefedapizza.com.br" "https://chefebot-pjif.vercel.app"; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$base/api/assinatura/operacao")"
            echo "$base/api/assinatura/operacao -> HTTP $status"
            cat "$body"
            test "$status" = "200"
            grep -Eq '"blocked"[[:space:]]*:[[:space:]]*true' "$body"
          done
