name: aplicar-na-rua-20min

on:
  push:
    branches:
      - codex/na-rua-20min-obrigatorio
    paths:
      - ".github/workflows/aplicar-na-rua-20min.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: codex/na-rua-20min-obrigatorio

      - name: Aplicar patch mínimo e verificável
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 ocorrência, encontrei {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          lib = "src/lib/limpezaOperacionalPedidos.ts"
          replace_once(lib,
              'export const LIMIAR_ENTREGA_MIN = 60;',
              'export const LIMIAR_ENTREGA_MIN = 20;')
          replace_once(lib,
              '''      titulo: `Pedido ainda não finalizado · ${idade}`,
              descricao:
                "Este pedido continua na etapa de saída. Confirme a conclusão ou informe que ele ainda está nessa etapa.",''',
              '''      titulo: "Essa entrega precisa de uma confirmação",
              descricao:
                `Já faz ${idade} que esse pedido está marcado como NA RUA. Se o cliente recebeu, finalize agora. Se o motoboy ainda estiver a caminho, me avise aqui e eu te lembro de novo em ${LIMIAR_ENTREGA_MIN} min.`,''')
          replace_once(lib,
              '      label: entrega === "retirada" ? "FINALIZAR RETIRADA" : "CONFIRMAR ENTREGA",',
              '      label: entrega === "retirada" ? "FINALIZAR RETIRADA" : entrega === "dine_in" ? "FINALIZAR PEDIDO" : "JÁ FOI ENTREGUE",')
          replace_once(lib,
              '      label: entrega === "retirada" ? "AINDA AGUARDANDO RETIRADA" : "AINDA ESTÁ NA RUA",',
              '      label: entrega === "retirada" ? "AINDA AGUARDANDO RETIRADA" : entrega === "dine_in" ? "AINDA NÃO FINALIZOU" : `AINDA ESTÁ NA RUA · LEMBRAR EM ${LIMIAR_ENTREGA_MIN} MIN`,')

          teste_lib = Path("src/lib/limpezaOperacionalPedidos.test.ts")
          t = teste_lib.read_text()
          inicio = t.index('  test("na rua alerta no limite existente e aguardar reinicia o mesmo limite", () => {')
          fim = t.index('\n  test("decisão de etapa anterior não silencia a próxima etapa"', inicio)
          novo_bloco = '''  test("na rua usa cronômetro próprio e cobra exatamente aos 20 min", () => {
            expect(LIMIAR_ENTREGA_MIN).toBe(20);

            const antes = pedido({
              id: String(AGORA - 180 * MIN),
              status: "saiu_entrega",
              statusAtualizadoEm: new Date(AGORA - 19 * MIN).toISOString(),
            });
            expect(idadeDaEtapaMinutos(antes, AGORA)).toBe(19);
            expect(classificarPendencia(antes, AGORA)).toBeNull();

            const noLimite = {
              ...antes,
              statusAtualizadoEm: new Date(AGORA - 20 * MIN).toISOString(),
            };
            const pendencia = classificarPendencia(noLimite, AGORA);
            expect(pendencia).toMatchObject({
              motivo: "entrega_longa",
              titulo: "Essa entrega precisa de uma confirmação",
              idadeMinutos: 20,
            });
            expect(pendencia?.descricao).toContain("Já faz 20 min");
            expect(pendencia?.descricao).toContain("eu te lembro de novo em 20 min");
          });

          test("ainda na rua reinicia o cronômetro e só cobra depois de outros 20 min", () => {
            const adiado19 = pedido({
              id: String(AGORA - 180 * MIN),
              status: "saiu_entrega",
              statusAtualizadoEm: new Date(AGORA - 19 * MIN).toISOString(),
              limpezaOperacional: {
                motivo: "entrega_longa",
                acao: "adiou",
                resolvidoEm: new Date(AGORA - 19 * MIN).toISOString(),
              },
            });
            expect(classificarPendencia(adiado19, AGORA)).toBeNull();

            const adiado20 = {
              ...adiado19,
              statusAtualizadoEm: new Date(AGORA - 20 * MIN).toISOString(),
              limpezaOperacional: {
                motivo: "entrega_longa" as const,
                acao: "adiou" as const,
                resolvidoEm: new Date(AGORA - 20 * MIN).toISOString(),
              },
            };
            expect(classificarPendencia(adiado20, AGORA)?.motivo).toBe("entrega_longa");
          });
'''
          teste_lib.write_text(t[:inicio] + novo_bloco + t[fim:])
          replace_once("src/lib/limpezaOperacionalPedidos.test.ts",
              '    expect(acaoPrincipal(p)).toMatchObject({ label: "CONFIRMAR ENTREGA", status: "entregue", tom: "principal" });\n    expect(acaoSecundaria(p)).toMatchObject({ label: "AINDA ESTÁ NA RUA", acao: "adiou", status: "saiu_entrega" });',
              '    expect(acaoPrincipal(p)).toMatchObject({ label: "JÁ FOI ENTREGUE", status: "entregue", tom: "principal" });\n    expect(acaoSecundaria(p)).toMatchObject({ label: "AINDA ESTÁ NA RUA · LEMBRAR EM 20 MIN", acao: "adiou", status: "saiu_entrega" });')

          page = "src/app/pedidos/page.tsx"
          replace_once(page,
              'import type { Pendencia, OpcaoResolucao, RegistroLimpeza } from "@/lib/limpezaOperacionalPedidos"',
              '''import {
            LIMIAR_ENTREGA_MIN,
            idadeDaEtapaMinutos,
            type Pendencia,
            type OpcaoResolucao,
            type RegistroLimpeza,
          } from "@/lib/limpezaOperacionalPedidos"''')
          replace_once(page,
              '''    const prevStatus = pedido.status
            const F2S: Record<string, Status> = { novo: "novo", em_preparo: "em_preparo", saiu_entrega: "saiu_entrega", entregue: "entregue" }''',
              '''    const prevStatus = pedido.status
            const statusAtualizadoEmAnterior = pedido.statusAtualizadoEm
            const statusAtualizadoEmOtimista = new Date().toISOString()
            const F2S: Record<string, Status> = { novo: "novo", em_preparo: "em_preparo", saiu_entrega: "saiu_entrega", entregue: "entregue" }''')
          replace_once(page,
              '    setPedidos(prev => prev.map(p => p.id === id ? { ...p, status: novoStatus } : p))',
              '''    setPedidos(prev => prev.map(p => p.id === id ? {
              ...p,
              status: novoStatus,
              statusAtualizadoEm: statusAtualizadoEmOtimista,
            } : p))''')
          replace_once(page,
              '      setPedidos(prev => prev.map(p => p.id === id ? { ...p, status: prevStatus } : p))',
              '''      setPedidos(prev => prev.map(p => p.id === id ? {
                ...p,
                status: prevStatus,
                statusAtualizadoEm: statusAtualizadoEmAnterior,
              } : p))''')
          replace_once(page,
              '''    const mins = tempoDesde(p.horario, p.horarioInicio, now)
            const meta = 40''',
              '''    const mins = p.status === "saiu_entrega"
              ? idadeDaEtapaMinutos(p, now)
              : tempoDesde(p.horario, p.horarioInicio, now)
            const meta = p.status === "saiu_entrega" ? LIMIAR_ENTREGA_MIN : 40''')
          replace_once(page,
              '<span style={{ fontSize: 12, color: "var(--foreground-secondary)", fontWeight: 600 }}>Recebido às {p.horario} · há {mins} min</span>',
              '<span style={{ fontSize: 12, color: "var(--foreground-secondary)", fontWeight: 600 }}>{p.status === "saiu_entrega" ? `Na rua há ${mins} min` : `Recebido às ${p.horario} · há ${mins} min`}</span>')
          replace_once(page,
              '''            const minsDesde = tempoDesde(pedido.horario, undefined, now)
            const minsPrep = tempoDesde(pedido.horario, pedido.horarioInicio, now)
            const isDineIn = pedido.tipoEntrega === "dine_in" || pedido.endereco === "Consumo no local"
            const nextStatus = (isDineIn && pedido.status === "em_preparo") ? "entregue" as Status : NEXT_STATUS[pedido.status]
            const isDone = pedido.status === "entregue"
            const isCanceled = pedido.status === "cancelado"
            const isNovo = pedido.status === "novo"
            const timerMins = isNovo ? minsDesde : minsPrep
            const timerColor = isNovo ? (minsDesde < 3 ? "var(--success)" : minsDesde < 7 ? "var(--primary)" : "var(--danger)") : isDone ? "var(--success)" : minsPrep < 20 ? "var(--success)" : minsPrep < 34 ? "var(--primary)" : "var(--danger)"''',
              '''            const minsDesde = tempoDesde(pedido.horario, undefined, now)
            const minsPrep = tempoDesde(pedido.horario, pedido.horarioInicio, now)
            const minsRua = pedido.status === "saiu_entrega" ? idadeDaEtapaMinutos(pedido, now) : 0
            const isDineIn = pedido.tipoEntrega === "dine_in" || pedido.endereco === "Consumo no local"
            const nextStatus = (isDineIn && pedido.status === "em_preparo") ? "entregue" as Status : NEXT_STATUS[pedido.status]
            const isDone = pedido.status === "entregue"
            const isCanceled = pedido.status === "cancelado"
            const isNovo = pedido.status === "novo"
            const timerMins = isNovo ? minsDesde : pedido.status === "saiu_entrega" ? minsRua : minsPrep
            const timerColor = isNovo
              ? (minsDesde < 3 ? "var(--success)" : minsDesde < 7 ? "var(--primary)" : "var(--danger)")
              : isDone
                ? "var(--success)"
                : pedido.status === "saiu_entrega"
                  ? (timerMins < 10 ? "var(--success)" : timerMins < LIMIAR_ENTREGA_MIN ? "var(--primary)" : "var(--danger)")
                  : minsPrep < 20 ? "var(--success)" : minsPrep < 34 ? "var(--primary)" : "var(--danger)"''')

          page_test = Path("src/app/pedidos/page.test.ts")
          pt = page_test.read_text()
          marcador = '''\ndescribe("/pedidos — item 'Acesso do salão' no menu lateral (Equipe)", () => {'''
          if marcador not in pt:
              raise SystemExit("page.test.ts: marcador final não encontrado")
          novos_testes = '''
          describe("/pedidos — cronômetro individual da etapa NA RUA", () => {
            test("o timer da rua usa a hora oficial da etapa e o limite de 20 minutos", () => {
              expect(fonte).toContain('pedido.status === "saiu_entrega" ? idadeDaEtapaMinutos(pedido, now) : 0');
              expect(fonte).toContain('pedido.status === "saiu_entrega" ? LIMIAR_ENTREGA_MIN : 40');
              expect(fonte).toContain('p.status === "saiu_entrega" ? `Na rua há ${mins} min`');
            });

            test("o clique que muda de etapa zera o relógio otimista imediatamente e rollback restaura o carimbo anterior", () => {
              const corpo = fonte.slice(
                fonte.indexOf("const avancarStatus = async"),
                fonte.indexOf("// Resolução de uma pendência do gate")
              );
              expect(corpo).toContain("const statusAtualizadoEmAnterior = pedido.statusAtualizadoEm");
              expect(corpo).toContain("const statusAtualizadoEmOtimista = new Date().toISOString()");
              expect(corpo).toContain("statusAtualizadoEm: statusAtualizadoEmOtimista");
              expect(corpo).toContain("statusAtualizadoEm: statusAtualizadoEmAnterior");
            });
          });
          '''
          page_test.write_text(pt.replace(marcador, "\n" + novos_testes + marcador, 1))

          ci = ".github/workflows/pedidos-operacional-ci.yml"
          replace_once(ci,
              '      - "src/components/LimpezaOperacionalPainel.tsx"\n',
              '      - "src/components/LimpezaOperacionalPainel.tsx"\n      - "src/app/pedidos/page.tsx"\n      - "src/app/pedidos/page.test.ts"\n')
          replace_once(ci,
              '          src/lib/limpezaOperacionalPedidos.test.ts\n',
              '          src/lib/limpezaOperacionalPedidos.test.ts\n          src/app/pedidos/page.test.ts\n')
          replace_once(ci,
              '          src/lib/limpezaOperacionalPedidos.test.ts\n          src/components/LimpezaOperacionalPainel.tsx\n',
              '          src/lib/limpezaOperacionalPedidos.test.ts\n          src/app/pedidos/page.test.ts\n          src/components/LimpezaOperacionalPainel.tsx\n')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Testes focados antes do commit
        run: npm test -- src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.test.ts

      - name: Lint focado nas regras e teste estrutural
        run: npm run lint -- src/lib/limpezaOperacionalPedidos.ts src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.test.ts

      - name: Validar diff e gravar na branch
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/limpezaOperacionalPedidos.ts src/lib/limpezaOperacionalPedidos.test.ts src/app/pedidos/page.tsx src/app/pedidos/page.test.ts .github/workflows/pedidos-operacional-ci.yml
          git commit -m "fix(pedidos): cronometro individual de 20 min na rua"
          git push origin HEAD:codex/na-rua-20min-obrigatorio
