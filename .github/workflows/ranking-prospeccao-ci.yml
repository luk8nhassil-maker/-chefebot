name: ranking-prospeccao-ci

on:
  pull_request:
    paths:
      - "src/lib/rankingProspeccao.ts"
      - "src/lib/rankingProspeccao.test.ts"
      - "src/components/RankingInviteModal.tsx"
      - "src/components/RankingInviteModal.test.ts"
      - "src/app/cardapio/page.tsx"
      - "src/app/cardapio/page.test.ts"
      - "src/app/cliente/page.tsx"
      - "src/app/cliente/page.test.ts"
      - "src/app/cliente/FidelidadeRankingScreen.tsx"
      - "src/app/cliente/FidelidadeRankingScreen.render.test.tsx"
      - "src/app/cliente/painelFidelidadeTipos.ts"
      - "src/app/api/cliente/privacidade/ranking/**"
      - "src/app/api/cliente/marketing-organico/**"
      - "src/app/api/marketing-organico/**"
      - "src/app/m/**"
      - "src/app/dev/ranking-prospeccao/**"
      - "src/lib/rankingClientes.ts"
      - "src/lib/rankingClientes.test.ts"
      - "src/lib/rankingHistorico.ts"
      - "src/lib/rankingHistorico.test.ts"
      - "src/lib/rankingCoroaDinamica.ts"
      - "src/lib/rankingCoroaDinamica.test.ts"
      - "src/lib/rankingCoroaDinamicaCobertura.test.ts"
      - "src/lib/historicoAnalitico.ts"
      - "src/lib/historicoAnalitico.test.ts"
      - "src/lib/rankingPrivacidade.ts"
      - "src/lib/rankingPrivacidade.test.ts"
      - "src/lib/rankingMissaoDivulgacao.ts"
      - "src/lib/rankingMissaoDivulgacao.test.ts"
      - "src/lib/rankingGamificacaoConfig.ts"
      - "src/lib/rankingGamificacaoConfig.test.ts"
      - "src/lib/rankingBonusTemporada.ts"
      - "src/lib/temporadas.ts"
      - "src/lib/temporadas.test.ts"
      - "src/lib/temporadaResultado.ts"
      - "src/lib/temporadaResultado.test.ts"
      - "src/app/api/cliente/fidelidade/painel/route.ts"
      - "src/app/api/cliente/fidelidade/painel/route.test.ts"
      - "src/app/api/admin/fidelidade/temporadas/route.ts"
      - "src/app/api/admin/fidelidade/temporadas/route.test.ts"
      - "src/app/api/admin/fidelidade/status/route.ts"
      - "src/app/api/admin/fidelidade/status/route.test.ts"
      - "src/app/admin/fidelidade/page.tsx"
      - "src/app/admin/fidelidade/page.test.ts"
      - "src/app/admin/fidelidade/GamificacaoConfigPanel.tsx"
      - "src/app/admin/fidelidade/GamificacaoConfigPanel.test.tsx"
      - "src/app/api/admin/ranking/gamificacao/**"
      - "vercel.json"
      - ".github/workflows/ranking-prospeccao-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranking-prospeccao-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do SHA validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Testes focados
        run: >-
          npm test --
          src/lib/rankingProspeccao.test.ts
          src/components/RankingInviteModal.test.ts
          src/app/api/cliente/privacidade/ranking/route.test.ts
          src/app/cliente/page.test.ts
          src/app/cliente/FidelidadeRankingScreen.render.test.tsx
          src/lib/rankingMissaoDivulgacao.test.ts
          src/app/api/cliente/marketing-organico/route.test.ts
          src/app/api/marketing-organico/visita/route.test.ts
          src/lib/rankingGamificacaoConfig.test.ts
          src/app/api/admin/ranking/gamificacao/route.test.ts
          src/app/admin/fidelidade/GamificacaoConfigPanel.test.tsx
          src/app/cardapio/page.test.ts
          src/app/dev/ranking-prospeccao/page.test.ts
          src/lib/rankingClientes.test.ts
          src/lib/rankingHistorico.test.ts
          src/lib/rankingCoroaDinamica.test.ts
          src/lib/rankingCoroaDinamicaCobertura.test.ts
          src/lib/historicoAnalitico.test.ts
          src/lib/rankingPrivacidade.test.ts
          src/lib/temporadas.test.ts
          src/lib/temporadaResultado.test.ts
          src/app/api/cliente/fidelidade/painel/route.test.ts
          src/app/api/admin/fidelidade/temporadas/route.test.ts
          src/app/api/admin/fidelidade/status/route.test.ts
          src/app/admin/fidelidade/page.test.ts

      - name: Lint do patch
        run: >-
          npm run lint --
          src/lib/rankingProspeccao.ts
          src/lib/rankingProspeccao.test.ts
          src/components/RankingInviteModal.tsx
          src/components/RankingInviteModal.test.ts
          src/app/api/cliente/privacidade/ranking/route.ts
          src/app/api/cliente/privacidade/ranking/route.test.ts
          src/app/cliente/page.tsx
          src/app/cliente/page.test.ts
          src/app/cliente/FidelidadeRankingScreen.tsx
          src/app/cliente/FidelidadeRankingScreen.render.test.tsx
          src/app/cliente/painelFidelidadeTipos.ts
          src/lib/rankingMissaoDivulgacao.ts
          src/lib/rankingMissaoDivulgacao.test.ts
          src/app/api/cliente/marketing-organico/route.ts
          src/app/api/cliente/marketing-organico/route.test.ts
          src/app/api/marketing-organico/visita/route.ts
          src/app/api/marketing-organico/visita/route.test.ts
          src/app/m/[token]/page.tsx
          src/lib/rankingGamificacaoConfig.ts
          src/lib/rankingGamificacaoConfig.test.ts
          src/lib/rankingBonusTemporada.ts
          src/app/api/admin/ranking/gamificacao/route.ts
          src/app/api/admin/ranking/gamificacao/route.test.ts
          src/app/admin/fidelidade/GamificacaoConfigPanel.tsx
          src/app/admin/fidelidade/GamificacaoConfigPanel.test.tsx
          src/app/cardapio/page.tsx
          src/app/cardapio/page.test.ts
          src/app/dev/ranking-prospeccao/page.tsx
          src/app/dev/ranking-prospeccao/RankingProspeccaoPreview.tsx
          src/app/dev/ranking-prospeccao/page.test.ts
          src/lib/rankingClientes.ts
          src/lib/rankingClientes.test.ts
          src/lib/rankingHistorico.ts
          src/lib/rankingHistorico.test.ts
          src/lib/rankingCoroaDinamica.ts
          src/lib/rankingCoroaDinamica.test.ts
          src/lib/rankingCoroaDinamicaCobertura.test.ts
          src/lib/historicoAnalitico.ts
          src/lib/historicoAnalitico.test.ts
          src/lib/temporadas.ts
          src/lib/temporadaResultado.ts
          src/lib/temporadaResultado.test.ts
          src/app/api/cliente/fidelidade/painel/route.ts
          src/app/api/cliente/fidelidade/painel/route.test.ts
          src/app/api/admin/fidelidade/temporadas/route.ts
          src/app/api/admin/fidelidade/temporadas/route.test.ts
          src/app/api/admin/fidelidade/status/route.ts
          src/app/api/admin/fidelidade/status/route.test.ts
          src/app/admin/fidelidade/page.tsx
          src/app/admin/fidelidade/page.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Suite completa
        run: npm test

      - name: Build de producao
        env:
          VERCEL_ENV: "preview"
        run: npm run build
